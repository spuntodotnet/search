name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt + clippy + tests + build release
    # Le repo est public : les runners hébergés par GitHub sont gratuits et sans
    # quota. Plus de runner self-hosted ici — sur un repo public, une PR venue
    # d'un fork y ferait tourner du code arbitraire sur notre machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installe rustup ET la toolchain (avec les composants demandés) plutôt
      # que de dépendre de ce qui est préinstallé sur l'image du runner.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (zero warning)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

  perimetre:
    name: le perimetre declare (compat.yaml -> docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyYAML
        run: pip install pyyaml

      # `docs/compat.md` et `docs/compat.json` sont **generes** depuis
      # `compat.yaml`. Une table tenue a la main derive : elle a annonce
      # « scroll : pas encore » des mois apres sa livraison. Cette etape echoue
      # si le fichier commite ne correspond plus a sa source.
      - name: docs/compat.md et docs/compat.json a jour
        run: python3 tests/compat/genere_compat.py --verifie

      # Les `poids` de compat.yaml sont **mesures** sur le corpus d'usage
      # publie (tests/compat/usage/corpus.jsonl), jamais ecrits a la main : un poids
      # devine vaudrait moins que pas de poids. Cette etape echoue si les deux
      # divergent, dans un sens comme dans l'autre.
      - name: les poids d'usage viennent du corpus
        run: python3 tests/compat/ponderation.py --verifie

      # Le generateur du fuzzer ne redit pas la liste des capacites : chaque
      # brique cite l'identifiant de celle qu'elle exerce. Renommer une capacite
      # doit casser bruyamment plutot que de laisser le fuzzer fuzzer a cote.
      # `--couverture` ne parle a aucun serveur : il verifie les identifiants, et
      # imprime les capacites declarees tenues que le fuzzer n'exerce pas.
      - name: les briques du fuzzer citent des capacites qui existent
        run: python3 tests/compat/fuzz_vs_es.py --couverture

      # Le premier argument du projet est une taille d'image, et c'est le chiffre
      # le plus facile a verifier pour un lecteur — donc celui qui coute le plus
      # cher quand il derive. Il ne se saisit plus a la main nulle part : la
      # campagne ecrit docs/container.json, le README et docs/bench.md en sont
      # generes, et cette etape echoue si un caractere differe. Elle ne parle a
      # aucun Docker : elle relit le rapport commite.
      - name: les chiffres du conteneur viennent de docs/container.json
        run: python3 tests/compat/chiffres_conteneur.py --verifie

  tantivy:
    name: l'epingle de tantivy contient ce qu'elle declare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `Cargo.toml` ne prend pas tantivy sur crates.io mais sur un fork : le
      # tag 0.26.1 plus le correctif d'amont des sous-agregations, non publie
      # (voir docs/tantivy-patch.md). Une epingle comme celle-la remplace neuf
      # paquets d'un coup, et « c'est juste le correctif d'amont » est
      # exactement le genre de phrase que ce depot n'accepte pas sans mesure.
      # Cette etape telecharge les crates publiees et compare fichier par
      # fichier : elle echoue si un fichier de plus differe, si un fichier
      # publie manque du fork, ou si l'ecart declare disparait.
      - name: le fork epingle est 0.26.1 plus un seul fichier
        run: python3 tests/compat/verifie_tantivy.py

  compat:
    name: harnais de compatibilite (client officiel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Client Elasticsearch officiel
        run: pip install "elasticsearch>=8,<9"

      # La seule preuve valable qu'une fonctionnalite marche : un vrai client
      # Elasticsearch officiel qui l'exerce contre ferrite.
      - name: tests/compat/run.sh
        run: ./tests/compat/run.sh

  conformance:
    name: conformance (cliquet anti-regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyYAML (le runner lit les cas au format YAML)
        run: pip install pyyaml

      # Les suites REST ne sont pas recopiees dans ce depot : elles sont
      # telechargees a la demande. Le cache evite de retirer les archives a
      # chaque CI ; la cle porte la version, donc en changer invalide.
      - name: cache de la suite REST d'Elasticsearch
        uses: actions/cache@v4
        with:
          path: .es-rest-spec
          key: es-rest-spec-7.10.2

      - name: cache de la suite REST d'OpenSearch
        uses: actions/cache@v4
        with:
          path: .opensearch-rest-spec
          key: opensearch-rest-spec-2.19.1

      - name: cargo build --release
        run: cargo build --release

      # La sortie du serveur part dans un fichier : un processus d'arriere-plan
      # qui garde la sortie de l'etape ouverte fait attendre le job.
      - name: demarrage de ferrite
        run: |
          FERRITE_BIND=127.0.0.1:9200 FERRITE_DATA="$(mktemp -d)" \
            nohup ./target/release/ferrite > ferrite.log 2>&1 &
          pret=0
          for _ in $(seq 1 100); do
            if curl -sf http://127.0.0.1:9200/ >/dev/null; then pret=1; break; fi
            sleep 0.2
          done
          if [ "$pret" != 1 ]; then
            echo "ferrite n'a pas demarre" >&2
            cat ferrite.log >&2
            exit 1
          fi
          curl -s http://127.0.0.1:9200/ | head -c 200; echo

      # Un cliquet, pas une cible : le job ne dit rien du nombre d'echecs, il
      # echoue si ce nombre augmente ou si un cas passe de reussi a echec.
      # `docs/conformance.json` est la reference, et il est commite.
      #
      # `--etat` verifie entre deux cas qu'aucun index, alias, template ni
      # reglage de cluster n'est apparu depuis l'etat de depart de la cible, et
      # arrete la campagne au premier ecart. Un cliquet qui bat ne vaut pas
      # mieux qu'un denominateur choisi : il coute 3,3 s sur 12 s, mesure, et
      # c'est la CI qui doit le payer.
      - name: suite de conformance, compare au rapport commite
        run: |
          python3 tests/compat/conformance_es.py http://127.0.0.1:9200 --etat \
            --json conformance-mesure.json --diff docs/conformance.json

      # La seconde source : la suite REST d'OpenSearch (Apache-2.0), ecrite par
      # une autre equipe et maintenue depuis 2021. Meme cliquet, meme forme de
      # rapport. `--divergences` est le rapport de **cette** suite contre un
      # vrai Elasticsearch 8.15 (commite) : il range les cas sur lesquels les
      # deux moteurs ne s'accordent plus, qui ne mesurent donc pas ferrite.
      # C'est un fichier, pas un jugement — la CI n'a besoin d'aucun conteneur.
      - name: suite de conformance d'OpenSearch, compare au rapport commite
        run: |
          python3 tests/compat/conformance_es.py http://127.0.0.1:9200 --etat \
            --source opensearch \
            --divergences docs/conformance-opensearch-es8150.json \
            --json conformance-opensearch-mesure.json \
            --diff docs/conformance-opensearch.json

      - name: rapports des mesures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-mesure
          path: |
            conformance-mesure.json
            conformance-opensearch-mesure.json
          if-no-files-found: warn

  docker:
    name: image minimale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t ferrite:ci .

      # `docker save` ne rend les blobs compresses que depuis le magasin d'images
      # containerd ; les runners sont encore en Docker 28, ou il ecrit des couches
      # nues — donc une taille decompressee sous le nom de compressee, ce que
      # tailles_image.py refuse desormais. L'artefact OCI, lui, est exactement ce
      # qu'un `docker push` enverrait.
      #
      # Il demande un second build : le driver buildx par defaut (`docker`) ne
      # sait pas exporter en OCI, seul un builder `docker-container` le peut, et
      # il ne partage pas le cache du daemon. Deux minutes, pour le seul chiffre
      # que ce depot publie.
      - name: artefact OCI (ce qu'un registre servirait)
        run: |
          docker buildx create --name ferrite-oci --driver docker-container --use
          docker buildx build --output type=oci,dest=/tmp/ferrite-oci.tar .

      # Les chiffres qui portent le projet sont mesures a chaque CI, pas une fois
      # pour toutes dans un README.
      #
      # Cette etape ne reecrit PAS docs/container.json : le rapport publie compare
      # ferrite et Elasticsearch mesures par le meme outil sur la MEME machine, et
      # un RSS ou un demarrage releves sur un runner partage ne se comparent pas a
      # ceux de la campagne. Elle prouve que l'outil tourne et que la taille reste
      # mesurable sur l'artefact OCI ; c'est le job `perimetre` qui tient le
      # cliquet entre le rapport et ce que la documentation publie.
      - name: taille d'image, RSS au repos, temps de demarrage
        run: IMAGE_TAR=/tmp/ferrite-oci.tar ./tests/compat/measure_container.sh ferrite:ci
