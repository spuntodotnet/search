[package]
name = "ferrite"
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
description = "Moteur de recherche compatible avec l'API Elasticsearch, bati sur tantivy"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "matched-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tantivy = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-segmentation = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "large-dates"] }

[dev-dependencies]
# Les tests de concurrence pilotent le moteur directement.
tantivy = "0.26"
# L'automate que tantivy compile derriere `RegexQuery` : les tests de traduction
# des motifs Lucene s'en servent pour verifier ce que le motif traduit accepte
# vraiment, plutot que sa forme.
tantivy-fst = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
