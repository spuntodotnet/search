[package]
name = "ferrite"
version = "0.10.0"
edition = "2021"
rust-version = "1.85"
description = "Moteur de recherche compatible avec l'API Elasticsearch, bati sur tantivy"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "matched-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tantivy = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-segmentation = "1"
# L'automate que tantivy compile derriere `RegexQuery`. Le surlignage doit dire
# « ce terme-la, la clause l'a trouve » : le confronter au **meme** automate est
# la seule facon de ne pas repondre a cote (`src/highlight.rs`). Deja dans
# l'arbre via tantivy — l'y nommer ne coute pas un octet de plus.
tantivy-fst = "0.5"
# L'automate de Levenshtein que tantivy compile derriere `FuzzyTermQuery`. Une
# clause `fuzzy` posee sur un champ `index: false` se joue sur le dictionnaire
# de la colonne : lui opposer le **meme** automate est la seule facon que les
# deux chemins rendent les memes documents. Deja dans l'arbre via tantivy —
# l'y nommer ne coute pas un octet de plus.
levenshtein_automata = "0.2"
# Les algorithmes Snowball, mesures identiques a ceux de Lucene sur les
# vocabulaires du projet Snowball (voir `src/langue.rs`). tantivy les expose
# deja sous forme de filtre, mais un analyzer de langue a besoin de les appeler
# **autour** d'autres regles : le prelude russe que rust-stemmers n'applique
# pas, et le dictionnaire de quatre mots que le neerlandais d'ES pose avant son
# stemmer. Deja dans l'arbre via tantivy — l'y nommer ne coute pas un octet.
rust-stemmers = "1.2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "large-dates"] }
# `Content-Encoding: gzip` / `deflate` sur le corps d'une requete : ce que pose
# tout client officiel a qui on demande de compresser. `rust_backend` (miniz_oxide)
# plutot que zlib : pas de C a lier, donc le binaire musl statique reste statique.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# Les tests de concurrence pilotent le moteur directement.
tantivy = "0.26"

# tantivy 0.26.1 perd les documents des buckets rares d'une sous-agregation des
# qu'un segment depasse 2 048 documents (mesure : 2 047 juste, 2 048 faux ; un
# bucket est perdu s'il a au plus 2048 / (2 * nombre de buckets) documents dans
# la fenetre qui se vide). Les `doc_count` restent exacts, donc la reponse est
# un 200 bien forme avec des valeurs fausses : le pire resultat possible ici.
#
# Le correctif est celui d'amont (tantivy issue #2992, commit 61693134), porte
# tel quel sur le tag 0.26.1 dans notre fork — 3 lignes ajoutees, 29 retirees,
# aucun autre changement. Il n'est pas encore publie : 0.26.1 reste la derniere
# version sur crates.io. L'epingle disparait le jour ou elle l'est.
#
# Ce qui la tient : `tests/spike_sous_aggs.rs`, qui echoue si elle saute.
# Pourquoi elle existe et comment en sortir : `docs/tantivy-patch.md`.
[patch.crates-io]
tantivy = { git = "https://github.com/spuntodotnet/tantivy", rev = "a8ffd13238c279aa1b529d1b94fb58d1b840fecd" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
