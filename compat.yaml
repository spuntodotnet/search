# compat.yaml — le perimetre declare de ferrite, en donnees
#
# Ce fichier est la **source** de ce que ferrite dit savoir faire. Trois
# lecteurs s'en servent, et c'est le point : une table ecrite a la main ne peut
# pas etre la source de verite de trois endroits.
#
#   docs/compat.md              genere (les tables d'etat ; le texte long reste
#                               ecrit a la main dans docs/compat.gabarit.md)
#   docs/compat.json            genere — la forme que lit une page web
#   tests/compat/ponderation.py  ecrit les `poids` depuis le corpus d'usage,
#                               et croise chaque requete du corpus avec les
#                               etats declares ici
#   tests/compat/conformance_es.py   croise chaque cas echoue avec ce fichier :
#                               un echec sur une capacite declaree `supporte`
#                               est une **regression**, un echec sur une
#                               capacite `refuse` est un **cout de perimetre**
#
#   python3 tests/compat/genere_compat.py             # regenere les deux
#   python3 tests/compat/genere_compat.py --verifie   # ce que fait la CI
#
# Une capacite porte :
#   id           stable, cite par les rapports — on ne le renomme pas a la legere
#   nom          ce qui s'affiche dans la table (markdown)
#   etat         supporte | partiel | refuse
#   detail       la prose de la colonne « Detail » (facultative)
#   parametres   pour un `partiel` : ce qui est supporte, ce qui est refuse
#   motif        pour un `refuse` : hors_perimetre | pas_encore | divergence_moteur
#   raison       pour un `refuse` : une phrase — c'est ce qui distingue
#                « je ne sais pas faire » de « je refuse expres »
#   poids        la part des requetes du corpus d'usage qui exercent cette
#                capacite, en pour-cent a une decimale (voir docs/usage.md).
#                **Ne s'ecrit pas a la main** : `ponderation.py --poids` le
#                calcule depuis data/usage/corpus.jsonl et `--verifie` echoue
#                si les deux divergent. `null` = le corpus ne sait pas
#                l'exercer (forme de reponse, scoring, mapping dynamique) ;
#                `0.0` = mesurable, jamais vu. Confondre les deux ferait
#                passer un trou de la mesure pour une absence d'usage
#   conformance  de quoi rattacher un cas de la suite d'Elastic a cette
#                capacite : `apis` (noms d'API REST, jokers acceptes) et
#                `erreurs` (motifs sur le message d'erreur, pour ce qui est
#                refuse *a l'interieur* d'une route supportee)

schema: 1
api_cible: "8.15.0"

etats:
  supporte:
    icone: "✅"
    legende: "supporté, vérifié par le harnais de compat (`tests/compat/`)"
  partiel:
    icone: "🟡"
    legende: "partiel — la partie supportée est décrite, le reste est refusé"
  refuse:
    icone: "❌"
    legende: "refusé **explicitement**, avec une erreur au format d'Elasticsearch"

motifs:
  hors_perimetre:
    titre: "hors périmètre assumé"
    legende: >-
      ferrite ne le fera pas : c'est ce qui fait le coût d'Elasticsearch, et
      ce dont un déploiement mono-conteneur n'a pas besoin
  pas_encore:
    titre: "pas encore"
    legende: >-
      rien ne s'y oppose, ce n'est pas écrit. Un manque, pas une impossibilité
  divergence_moteur:
    titre: "divergence de moteur"
    legende: >-
      tantivy ne fait pas exactement ce que fait Lucene ; l'accepter quand
      même rendrait d'autres résultats qu'Elasticsearch, en silence
  comme_es:
    titre: "comme Elasticsearch"
    legende: >-
      un refus qui **est** la compatibilité : Elasticsearch refuse aussi, et
      ferrite reproduit son erreur

tables:

  # ---------------------------------------------------------------------------
  - id: cluster
    entete: ["Route", "État", "Détail"]
    capacites:

      - id: cluster.racine
        nom: "`GET /`"
        etat: supporte
        poids: 0.1
        detail: "`name`, `cluster_name`, `cluster_uuid`, bloc `version` complet, `tagline`"
        conformance: {apis: [info]}

      - id: cluster.ping
        nom: "`HEAD /` (`ping`)"
        etat: supporte
        poids: 0.0
        conformance: {apis: [ping]}

      - id: cluster.health
        nom: "`GET /_cluster/health`, `/_cluster/health/{index}`"
        etat: partiel
        poids: 0.2
        detail: "toujours `green`, 1 nœud, 0 shard non assigné"
        parametres:
          supportes:
            - {nom: "wait_for_status", note: "accepté et sans objet, déjà vert"}
            - {nom: "timeout", note: "accepté et sans objet, déjà vert"}
          refuses:
            - {nom: "level", note: "il change la forme de la réponse"}
            - {nom: "wait_for_active_shards"}
            - {nom: "wait_for_nodes"}
            - {nom: "wait_for_events"}
            - {nom: "wait_for_no_relocating_shards"}
            - {nom: "wait_for_no_initializing_shards"}
            - {nom: "local", note: "il n'y a qu'un nœud, donc rien de local à opposer au maître"}
        conformance: {apis: [cluster.health]}

      - id: cluster.cat_indices
        nom: "`GET /_cat/indices`, `/_cat/indices/{index}`"
        etat: partiel
        poids: 0.1
        detail: "texte aligné par défaut"
        parametres:
          supportes: ["format=json", "v"]
          refuses: ["h", "s", "bytes", "help"]
        conformance: {apis: [cat.indices]}

      - id: cluster.cat_health
        nom: "`GET /_cat/health`"
        etat: partiel
        poids: 0.0
        detail: "idem"
        parametres:
          supportes: ["format=json", "v"]
          refuses: ["h", "s", "help", "ts"]
        conformance: {apis: [cat.health]}

      - id: cluster.nodes
        nom: "`GET /_nodes`, `/_nodes/{spec}`"
        etat: partiel
        poids: 0.4
        detail: >-
          un nœud, champs d'identité et `http` ; pas de `settings`, `os`, `jvm`.
          `{spec}` accepte `_all`, `_local`, `_master` et l'identifiant du nœud
        parametres:
          refuses:
            - {texte: "les sous-ressources", note: "`_nodes/stats`, `_nodes/hot_threads`…"}
            - {texte: "`/_nodes/{spec}/{metric}`", note: "donc le *sniffing*, qui demande `/_nodes/_all/http` : refusé en le nommant, et les trois clients officiels restent utilisables après ce refus (mesuré)"}
        conformance: {apis: [nodes.info]}

      - id: cluster.compression
        nom: "`Content-Encoding: gzip` / `deflate` sur le corps d'une requête"
        etat: supporte
        poids: null
        detail: >-
          ce que pose tout client officiel à qui on demande de compresser —
          `http_compress=True` en Python, `compression: true` en JavaScript
          (activé **par défaut** vers Elastic Cloud), `CompressRequestBody` en
          Go. `gzip` et `deflate` sont décompressés ; `br` et un encodage
          inconnu sont transmis tels quels, exactement comme le fait
          Elasticsearch — mesuré, les deux. Un corps annoncé compressé et
          illisible est refusé **en nommant l'encodage**, là où ES rend
          « request body is required », qui désigne la mauvaise cause

  # ---------------------------------------------------------------------------
  - id: hors_perimetre
    entete: ["Famille de routes", "État", "Pourquoi"]
    capacites:

      - id: hors.cluster_distribue
        nom: >-
          Cluster distribué — `_cluster/state`, `_cluster/stats`,
          `_cluster/reroute`, `_cluster/allocation/explain`, `_cluster/pending_tasks`,
          `_remote/info`, `_nodes/stats`, `_tasks`
        etat: refuse
        motif: hors_perimetre
        poids: 1.8
        raison: >-
          ferrite est mono-nœud et mono-shard : il n'y a ni allocation, ni
          réallocation, ni tâche distribuée à rapporter, et une réponse
          plausible inventée pour ces routes serait un mensonge sur la nature du
          serveur.
        conformance:
          apis: ["cluster.*", "nodes.*", "tasks.*", "dangling_indices.*",
                 "features.*", "health_report", "shutdown"]

      - id: hors.cat
        nom: "Les `_cat/*` autres que `_cat/indices` et `_cat/health`"
        etat: refuse
        motif: pas_encore
        poids: 1.1
        raison: >-
          ce sont des vues de texte sur un état que ferrite a pour la plupart ;
          elles ne sont pas écrites, et leurs tests exigent en plus les colonnes
          `h`, `s` et `help` que les deux `_cat` existants n'ont pas non plus.
        conformance: {apis: ["cat.*"]}

      - id: hors.snapshots
        nom: "Snapshots, dépôts, restauration — `_snapshot/*`"
        etat: refuse
        motif: hors_perimetre
        poids: 2.0
        raison: >-
          la sauvegarde d'un ferrite est la copie de son répertoire de données,
          ou l'export par `scroll` ; un dépôt de snapshots répliqué est de la
          mécanique de cluster.
        conformance: {apis: ["snapshot.*"]}

      - id: hors.flux_de_donnees
        nom: "Flux de données — `_data_stream`, `data_stream` dans un template"
        etat: refuse
        motif: hors_perimetre
        poids: 0.9
        raison: >-
          un flux de données est une suite d'index gérée par `_rollover` et
          l'ILM, donc de l'exploitation de cluster posée au-dessus du moteur.
          Le refus est déclaré ici parce qu'il est **exercé** : `helpers.reindex`
          du client officiel demande `GET /_data_stream/{cible}` avant de
          copier, sur toute cible — c'est la suite serveur du client Python qui
          l'a montré, et sans cette ligne l'appel comptait `indeterminé`, donc
          contre nous.
        conformance:
          apis: ["indices.get_data_stream", "indices.put_data_stream",
                 "indices.delete_data_stream", "indices.data_streams_stats",
                 "indices.migrate_to_data_stream", "indices.promote_data_stream"]
          erreurs: ["ne supporte pas les flux de donnees"]

      - id: hors.cycle_de_vie
        nom: >-
          Cycle de vie d'un index — `_close`, `_open`, `_forcemerge`,
          `_shrink`, `_split`, `_clone`, `_rollover`, `_recovery`, `_segments`,
          `_flush`, `_upgrade`, `_cache/clear`, `_shard_stores`, `_resolve/index`
        etat: refuse
        motif: pas_encore
        poids: 2.6
        raison: >-
          la moitié de ces routes n'a pas de sens sans shards (`_shrink`,
          `_split`, `_recovery`, `_shard_stores`) ; l'autre moitié suppose un
          index qu'on peut arrêter de servir sans le supprimer (`_close` /
          `_open`), état que ferrite n'a pas.
        conformance: {apis: ["indices.*"]}

      - id: hors.autres_recherches
        nom: >-
          Les autres routes de recherche — `_search_shards`,
          `_termvectors`, `_mtermvectors`, `_suggest`, `_source`
        etat: refuse
        motif: pas_encore
        poids: 0.6
        raison: >-
          aucune n'est demandée par le code client qu'on cherche à servir.
        conformance:
          apis: [search_shards, termvectors, mtermvectors, suggest,
                 get_source, exists_source, mlt, rank_eval, knn_search,
                 terms_enum, search_mvt, open_point_in_time, close_point_in_time]

      - id: hors.api_typee
        nom: >-
          L'API typée — un `{type}` dans l'URL, un `_type` dans la réponse,
          `include_type_name`
        etat: refuse
        motif: comme_es
        poids: null
        raison: >-
          elle a disparu en 8.x, la version que ferrite annonce : un vrai
          Elasticsearch 8 échoue au même endroit, et la rendre reviendrait à
          annoncer une version qu'on ne sert pas.
        conformance:
          marqueurs: [api_typee]
          erreurs: ["unrecognized parameter: \\[include_type_name\\]",
                    "\\[_type\\] attendu"]

      - id: hors.xpack
        nom: >-
          Tout ce qu'Elastic ajoute autour du moteur — sécurité et rôles
          (`_security`), machine learning (`_ml`), cycle de vie
          (`_ilm`, `_slm`), `_watcher`, `_transform`, `_enrich`, `_eql`,
          `_sql`, `_esql`, `_inference`, connecteurs, *search applications*,
          `_rollup`, `_ccr`, `_graph`, licence, `_monitoring`
        etat: refuse
        motif: hors_perimetre
        poids: 18.9
        raison: >-
          ce sont des produits posés sur le moteur, pas le moteur : chacun a
          son propre modèle de données et sa propre API, et aucun n'est ce
          qu'un client Elasticsearch existant appelle pour chercher des
          documents. C'est le corpus d'usage qui a montré qu'aucune capacité
          ne les réclamait — donc que **19 % de ses requêtes** tombaient dans
          un trou de la déclaration, ni servies ni refusées.
        conformance:
          apis: ["security.*", "ml.*", "ilm.*", "slm.*", "ccr.*", "watcher.*",
                 "transform.*", "enrich.*", "eql.*", "sql.*", "esql.*",
                 "inference.*", "connector.*", "search_application.*",
                 "query_rules.*", "rollup.*", "synonyms.*", "autoscaling.*",
                 "async_search.*", "license.*", "xpack.*", "graph.*",
                 "logstash.*", "searchable_snapshots.*", "monitoring.*",
                 "text_structure.*", "migration.*", "ssl.*", "shutdown.*",
                 "profiling.*", "fleet.*", "watcher", "security", "ml"]

      - id: hors.scripts
        nom: "Scripting — `_scripts`, `_search/template`, `_render/template`, Painless"
        etat: refuse
        motif: hors_perimetre
        poids: 0.9
        raison: >-
          un moteur de script est un langage à embarquer, à isoler et à
          maintenir : c'est exactement le genre de poids que ferrite existe pour
          ne pas porter.
        conformance:
          apis: [put_script, get_script, delete_script, get_script_context,
                 get_script_languages, search_template, msearch_template,
                 render_search_template, scripts_painless_execute]

  # ---------------------------------------------------------------------------
  - id: index
    entete: ["", "État", "Détail"]
    capacites:

      - id: index.creation_a_lecriture
        nom: "Création à l'écriture"
        etat: supporte
        poids: null
        detail: >-
          indexer dans un index absent le **crée**, comme ES
          (`action.auto_create_index`) : `index`, `create`, `update`, et le
          `_bulk`. La lecture, la recherche et la suppression rendent toujours 404

      - id: index.expressions
        nom: "Expressions d'index (`a,b`, `logs-*`, `_all`, exclusions, alias)"
        etat: supporte
        poids: null
        detail: "sur **toutes** les routes, recherche comprise — voir la section dédiée"

      - id: index.creation
        nom: "`PUT /{index}`"
        etat: partiel
        poids: 10.5
        detail: >-
          `mappings` est **optionnel** (les champs viendront des documents) ;
          `settings` s'écrit à plat comme imbriqué
        parametres:
          supportes:
            - {nom: "mappings"}
            - {nom: "aliases"}
            - {nom: "settings.number_of_shards", note: "accepté, sans effet : ferrite est mono-shard"}
            - {nom: "settings.number_of_replicas", note: "accepté, sans effet"}
            - {nom: "settings.index.query.parse.allow_unmapped_fields", note: "voir plus bas"}
            - {nom: "settings.index.max_ngram_diff", note: "voir plus bas"}
            - {nom: "settings.analysis", note: "`analyzer`, `tokenizer`, `filter` — voir la section des analyzers sur mesure"}
          refuses:
            - {texte: "tout autre réglage", note: "refusé plutôt qu'ignoré"}
        conformance: {apis: [indices.create]}

      - id: index.suppression
        nom: "`DELETE /{index}`"
        etat: supporte
        poids: 0.6
        detail: >-
          listes et motifs, sous `action.destructive_requires_name` (voir plus
          bas). `ignore_unavailable` honoré
        conformance: {apis: [indices.delete]}

      - id: index.existe
        nom: "`HEAD /{index}`"
        etat: supporte
        poids: 0.0
        detail: "200 dès que l'expression se résout, même sur zéro index — comme ES"
        conformance: {apis: [indices.exists]}

      - id: index.lecture
        nom: "`GET /{index}`"
        etat: supporte
        poids: 0.1
        detail: "`aliases` / `mappings` / `settings`, une entrée par index visé"
        conformance: {apis: [indices.get]}

      - id: index.mapping
        nom: "`GET /{index}/_mapping`"
        etat: supporte
        poids: 0.2
        conformance: {apis: [indices.get_mapping]}

      - id: index.mapping_field
        nom: "`GET /{index}/_mapping/field/{champs}`"
        etat: refuse
        motif: pas_encore
        poids: 0.2
        raison: >-
          route absente (`no handler found`) : ferrite a pourtant le mapping,
          c'est un manque et pas une impossibilité — 15 cas de la suite d'Elastic
          tombent dessus.
        conformance: {apis: [indices.get_field_mapping]}

      - id: index.settings_lecture
        nom: "`GET /{index}/_settings`"
        etat: partiel
        poids: 0.3
        detail: >-
          les réglages d'ES qu'un index a vraiment (`number_of_shards`, `uuid`,
          `creation_date`…), et `index.query.parse.allow_unmapped_fields` s'il a
          été posé
        parametres:
          refuses:
            - {nom: "include_defaults", note: "il ajoute une section `defaults` avec les dizaines de réglages qu'ES a et que ferrite n'a pas"}
            - {texte: "la section `analysis`", note: "ES rend la déclaration d'analyse de l'index ; ferrite ne la rend pas. Il n'en garde que la forme **normalisée** dont il a besoin pour rejouer les analyzers, et rendre celle-là ferait lire au client des noms de filtres qu'il n'a jamais écrits — ce qui serait pire qu'une absence. Les analyzers eux-mêmes sont bien là : `GET /{index}/_mapping` rend le nom déclaré sur chaque champ, et `_analyze` les exerce"}
          supportes:
            - {texte: "`GET /_settings` sans index", note: "vaut `_all`"}
            - {texte: "`/{index}/_settings/{nom}`", note: "filtrer par nom de réglage — liste, jokers, `_all`. Le filtre porte sur les clés **aplaties**, sans quoi le même nom filtrerait autrement selon `flat_settings`"}
            - {nom: "flat_settings", note: "il aplatit les clés (`index.number_of_shards`) ; longtemps refusé, parce qu'accepté et ignoré il rendait une réponse que personne n'avait demandée — c'est une réécriture de clés, elle est maintenant faite"}
            - {nom: "local", note: "un seul nœud : la question ne se pose pas"}
        conformance:
          apis: [indices.get_settings]
          erreurs:
            - "ne supporte pas \\[include_defaults\\] sur \\[/\\{index\\}/_settings\\]"

      - id: index.settings_ecriture
        nom: "`PUT /{index}/_settings`"
        etat: partiel
        poids: 0.7
        detail: >-
          les réglages **inertes** sont acceptés, gardés et rendus par
          `GET /{index}/_settings` : ils décrivent déjà ce que ferrite est
          (mono-shard, sans réplique). Faire échouer un script d'init entier sur
          un `number_of_replicas: 1` qui ne changerait rien serait pire que de
          l'accepter. `index.refresh_interval` n'est pas accepté-et-ignoré :
          `-1` sort vraiment l'index de la boucle de rafraîchissement de fond
        parametres:
          supportes:
            - {nom: "number_of_replicas", note: "sans effet — ferrite n'a pas de réplique"}
            - {nom: "auto_expand_replicas", note: "sans effet, même raison"}
            - {nom: "refresh_interval", note: "`-1` désactive vraiment le rafraîchissement de fond ; une valeur positive est honorée, ferrite rafraîchissant toutes les secondes"}
            - {nom: "preserve_existing"}
            - {nom: "max_ngram_diff", note: "l'écart maximal entre `max_gram` et `min_gram` d'un `ngram` (défaut 1) ; il **valide** ce que `settings.analysis` déclare, c'est le seul réglage d'index dans ce cas"}
            - {texte: "une valeur `null`", note: "efface le réglage, comme chez ES"}
          refuses:
            - {nom: "number_of_shards", note: "figé à la création, comme chez ES (`Can't update non dynamic settings`)"}
            - {texte: "`index.query.parse.allow_unmapped_fields`", note: "figé dans la génération courante du schéma ; un client qui le croirait changé chercherait longtemps"}
            - {nom: "reopen"}
            - {texte: "tout autre réglage d'ES", note: "`index.blocks.*`, `index.max_result_window`… : les accepter puis les ignorer changerait le comportement en silence"}
        conformance:
          apis: [indices.put_settings]
          erreurs:
            - "ne supporte pas le reglage d'index"
            - "ne supporte pas de changer \\[index.query.parse.allow_unmapped_fields\\]"
            - "ne supporte pas \\[reopen\\]"

      - id: index.mapping_ecriture
        nom: "`PUT /{index}/_mapping`"
        etat: partiel
        poids: 0.5
        detail: >-
          **ajoute** des champs (une nouvelle génération est construite). Changer
          le type d'un champ existant reste refusé, comme chez ES
        parametres:
          refuses:
            - {nom: "dynamic", note: "le modifier après coup"}
        conformance: {apis: [indices.put_mapping]}

      - id: index.refresh
        nom: "`POST /{index}/_refresh`"
        etat: supporte
        poids: 0.3
        conformance: {apis: [indices.refresh]}

      - id: index.analyze
        nom: "`POST|GET /_analyze`, `/{index}/_analyze`"
        etat: partiel
        poids: 2.2
        detail: >-
          les offsets sont comptés en **unités UTF-16**, comme chez ES (c'est la
          convention de Java) ; sur plusieurs `text`, chaque texte suivant décale
          les offsets de la longueur du précédent **plus un**, et les positions
          de 100 quand l'analyzer est sur mesure, de 0 quand il est intégré
        parametres:
          supportes:
            - {nom: "text", note: "chaîne ou liste"}
            - {nom: "analyzer"}
            - {nom: "field"}
            - {nom: "tokenizer", note: "un nom (`ngram`) ou un objet (`{\"type\": \"ngram\", …}`), sans index — c'est ce qui rend une brique d'analyse mesurable toute seule"}
            - {nom: "filter", note: "une liste de noms ou d'objets, même règle"}
          refuses:
            - {nom: "char_filter"}
            - {nom: "normalizer"}
            - {nom: "explain"}
            - {nom: "attributes"}
            - {texte: "le champ `type` du token", note: "ferrite rend toujours `<ALPHANUM>`, là où ES distingue `<NUM>`, `word`, `<EMOJI>`… ; il ne change ni les termes indexés ni les résultats"}
        conformance: {apis: [indices.analyze]}

      - id: index.mapping_dynamique
        nom: "Mapping dynamique"
        etat: supporte
        poids: null
        detail: "`dynamic` : `true` (défaut), `false`, `strict`. `runtime` ❌. Voir plus bas"

      - id: index.alias
        nom: "Alias"
        etat: supporte
        poids: null
        detail: "voir la section dédiée"

      - id: index.templates
        nom: "Templates d'index — `_index_template` et `_template`"
        etat: partiel
        poids: 2.4
        detail: >-
          `PUT` / `GET` / `HEAD` / `DELETE` sur les deux familles, et
          l'application du template à la création de l'index — **implicite**
          (une écriture dans un index absent) comme **explicite**
          (`PUT /{index}`, où le corps l'emporte). Un composable qui correspond
          éclipse les anciens ; sinon tous les anciens qui correspondent sont
          fusionnés par `order` croissant, comme chez ES. Le contenu est validé
          **à la pose** : un réglage refusé, un type de champ inconnu ou un
          alias filtré font échouer le `PUT`, là où le client regarde
        parametres:
          supportes:
            - {nom: "index_patterns"}
            - {nom: "template", note: "`settings`, `mappings`, `aliases`"}
            - {nom: "priority", note: "composables — le plus fort gagne, et deux motifs qui se recouvrent à priorité égale sont refusés comme chez ES"}
            - {nom: "order", note: "anciens — fusion par ordre croissant"}
            - {nom: "version"}
            - {nom: "_meta"}
            - {nom: "create"}
            - {nom: "flat_settings", note: "sur `GET /_template`"}
          refuses:
            - {nom: "composed_of", note: "les templates de composants (`_component_template`) ne sont pas implémentés ; appliquer un template qui en cite un sans le lire donnerait un index sans le mapping demandé"}
            - {nom: "data_stream"}
            - {nom: "include_defaults"}
        conformance:
          apis: [indices.put_template, indices.get_template, indices.delete_template,
                 indices.exists_template, indices.put_index_template,
                 indices.get_index_template, indices.delete_index_template,
                 indices.exists_index_template]

      - id: index.templates_composants
        nom: "`_component_template`, `_simulate_index_template`, `_simulate`"
        etat: refuse
        motif: pas_encore
        poids: 0.9
        raison: >-
          un template de composants est un template qu'on cite depuis un autre :
          tant qu'il n'est pas lu, `composed_of` est refusé à la pose plutôt
          qu'appliqué à moitié. La simulation, elle, rend l'index qu'on
          obtiendrait — utile, et sans client qui la demande.
        conformance:
          apis: [indices.simulate_index_template, indices.simulate_template,
                 cluster.put_component_template, cluster.get_component_template,
                 cluster.delete_component_template, cluster.exists_component_template]

      - id: index.stats
        nom: "`GET /{index}/_stats`"
        etat: partiel
        poids: 0.2
        detail: >-
          la forme d'ES — `_shards`, `_all` (`primaries` / `total`), `indices` —
          et les quatre groupes que ferrite **mesure**. Sur un moteur mono-shard
          sans réplique, `primaries` et `total` portent les mêmes nombres : c'est
          vrai, pas une simplification
        parametres:
          supportes:
            - {nom: "docs", note: "`count`, `deleted`"}
            - {nom: "store", note: "`size_in_bytes`, `total_data_set_size_in_bytes`"}
            - {nom: "segments", note: "`count`"}
            - {nom: "shard_stats", note: "`total_count`"}
            - {nom: "level", note: "`cluster`, `indices`, `shards`"}
          refuses:
            - {texte: "les autres groupes de compteurs", note: "`indexing`, `search`, `get`, `merge`, `translog`, les caches… : ferrite ne les tient pas, et un `index_total: 0` sur un index qu'on vient de remplir ferait passer « non mesuré » pour « aucune activité »"}
            - {nom: "fields"}
            - {nom: "groups"}
            - {nom: "completion_fields"}
            - {nom: "fielddata_fields"}
            - {nom: "_shards.total", note: "un shard par index, toujours : un cas de la suite d'Elastic qui crée un index à 5 shards et en attend 10 au total ne peut pas passer ici — et ne devrait pas"}
        conformance:
          apis: [indices.stats]
          erreurs:
            - "ne supporte pas la metrique \\[[a-z_]+\\] de \\[_stats\\]"
            - "ne supporte pas \\[(fields|groups|completion_fields|fielddata_fields)\\] sur \\[_stats\\]"
            # Les groupes de compteurs que ferrite ne tient pas : un cas qui les
            # lit ne mesure pas un ecart, il mesure ce refus. Les motifs citent
            # les noms de groupe d'ES, ils ne peuvent donc pas attraper autre
            # chose que `_stats`.
            - "\\[_all\\.(total|primaries)\\.(indexing|search|get|merges|merge|refresh|flush|warmer|query_cache|fielddata|completion|translog|request_cache|recovery|bulk|segments\\.file_sizes)\\]"
            # `level=shards` : ferrite rend son shard unique et ses compteurs,
            # pas l'etat interne d'un shard Lucene (commit, seq_no, baux de
            # retention).
            - "\\[indices\\.[^]]*\\.shards\\.0\\.0\\."

