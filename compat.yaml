  - id: analyzers
    entete: ["Analyzer", "État", "Détail"]
    capacites:

      - id: analyzer.standard
        nom: "`standard` (défaut)"
        etat: supporte
        poids: 0.2
        detail: "identique à ES sur les 217 textes"

      - id: analyzer.simple
        nom: "`simple`"
        etat: supporte
        poids: 0.0
        detail: "identique"

      - id: analyzer.whitespace
        nom: "`whitespace`"
        etat: supporte
        poids: 0.0
        detail: "identique"

      - id: analyzer.keyword
        nom: "`keyword`"
        etat: supporte
        poids: 0.0
        detail: "identique"

      - id: analyzer.stop
        nom: "`stop`"
        etat: supporte
        poids: 0.0
        detail: "identique"

      - id: analyzer.english
        nom: "`english`"
        etat: supporte
        poids: 0.1
        detail: "identique — Porter porté depuis Lucene, filtre possessif compris"

      - id: analyzer.french
        nom: "`french`"
        etat: supporte
        poids: 0.0
        detail: "identique — stemmer léger de Savoy, élision, mots vides relevés"

      - id: analyzer.snowball
        nom: "`snowball`"
        etat: supporte
        poids: 0.0
        detail: >-
          identique — `standard` + minuscules + mots vides anglais + Snowball
          **anglais** (`porter2`), qui n'est pas le Porter de `english` :
          `quickly` rend `quick` ici et `quickli` là

      - id: analyzer.langues
        nom: >-
          `danish`, `dutch`, `german`, `hungarian`, `italian`, `norwegian`,
          `portuguese`, `romanian`, `russian`, `spanish`, `swedish`, `turkish`
        etat: supporte
        poids: 0.0
        detail: >-
          identiques à ES sur les vocabulaires du projet Snowball (BSD-3-Clause,
          20 913 à 96 325 mots par langue, écrits par d'autres) — **positions et
          offsets compris**, `tests/compat/sonde_langues.py`. Le refus reposait
          sur « le stemmer de tantivy n'est pas celui de Lucene » : la mesure a
          montré que c'est faux pour 8 de ces 12 langues (0 écart), et que le
          reste tenait aux mots vides, à quatre filtres absents et aux stemmers
          **légers** que l'allemand, l'espagnol, l'italien et le portugais d'ES
          posent à la place de Snowball

      - id: analyzer.finnish
        nom: "`finnish`"
        etat: refuse
        motif: divergence_moteur
        poids: 0.0
        raison: >-
          le stemmer finnois de `rust-stemmers` s'écarte de celui de Lucene sur
          **13 mots des 84 399** du vocabulaire finnois de Snowball (0,015 %) :
          il coupe la voyelle finale d'un emprunt à diacritique étranger là où
          l'algorithme la garde (`garcía` rend `garcí` chez lui et `garcía` chez
          ES ; de même `bundesstraße`, `españa`, `musée`). Un analyzer n'est
          jamais livré sous le nom d'ES tant qu'il n'est pas mesuré identique —
          un écart de 0,015 % rendu en 200 est le pire résultat possible ici.

      - id: analyzer.autres_langues
        nom: "`arabic`, `czech`, `greek`, `thai` et les autres langues"
        etat: refuse
        motif: pas_encore
        poids: 0.0
        raison: >-
          leur chaîne demande des filtres de normalisation qui ne sont pas
          portés (et, pour plusieurs, un stemmer absent de `rust-stemmers`).
          Rien n'y est mesuré : les douze langues servies le sont mot à mot, et
          celles-ci ne le seraient pas.

      - id: analyzer.sur_mesure
        nom: "Analyzers sur mesure (`settings.analysis`)"
        etat: supporte
        poids: null
        detail: "voir ci-dessous"

  # ---------------------------------------------------------------------------
  - id: analyzers_sur_mesure
    entete: ["", "État", "Détail"]
    capacites:

      - id: analyse.custom
        nom: "`analysis.analyzer` de type `custom`"
        etat: supporte
        poids: 2.8
        detail: "`tokenizer` + liste de `filter`"

      - id: analyse.tokenizers
        nom: "Tokenizers"
        etat: partiel
        poids: 0.3
        detail: >-
          cités par leur nom, ou **déclarés** dans `analysis.tokenizer` avec
          leurs paramètres
        parametres:
          supportes:
            - {texte: "`standard`, `whitespace`, `keyword`, `letter`, `lowercase`"}
            - {texte: "`ngram`, `edge_ngram`", note: "voir la ligne dédiée"}
          refuses:
            - {texte: "`pattern`, `char_group`, `path_hierarchy`, `uax_url_email`…", note: "aucun mapping venu d'une instance réelle n'en a encore demandé"}

      - id: analyse.ngram
        nom: "`ngram` et `edge_ngram` — tokenizer **et** filtre"
        etat: supporte
        poids: null
        detail: >-
          la brique de l'autocomplétion « au fil de la frappe » : elle travaille
          à l'**indexation**, là où `match_phrase_prefix` travaille à la
          requête. Mesurée identique à ES sur 217 textes, **positions et offsets
          compris** (`diff_analyzers.py`) : un n-gramme mal positionné casse
          `match_phrase` sans changer le compte de tokens
        parametres:
          supportes:
            - {nom: "min_gram", note: "défaut 1"}
            - {nom: "max_gram", note: "défaut 2 — sauf le filtre `edge_ngram` **cité par son nom**, qui vaut 1, le défaut de Lucene"}
            - {nom: "token_chars", note: "tokenizer — `letter`, `digit`, `whitespace`, `punctuation`, `symbol`, `custom`. Les classes sont celles de `Character.getType`, mesurées caractère par caractère contre ES sur 710 caractères"}
            - {nom: "custom_token_chars", note: "tokenizer, exigé par `token_chars: [custom]`"}
            - {nom: "side", note: "filtre `edge_ngram` : `front` (défaut) ou `back`. Sur le **tokenizer**, ES ne le lit pas et rend les grammes de tête ; ferrite fait pareil"}
            - {nom: "preserve_original", note: "filtre : ajoute le token entier, et le garde quand il est plus court que `min_gram`"}
          refuses:
            - {texte: "les noms de catégories Unicode fines dans `token_chars`", note: "ES accepte aussi `math_symbol`, `connector_punctuation`… ; ferrite s'en tient aux six classes documentées et refuse le reste explicitement"}

      - id: analyse.filtres
        nom: "Filtres"
        etat: partiel
        poids: 1.6
        parametres:
          supportes:
            - {nom: "lowercase", note: "celles de Java, pas celles de Rust : les 31 caractères **titre** (`ǅ`, `ᾈ`…) et le `İ` turc sont repliés comme chez ES, mesuré caractère par caractère. `language` est refusé — seul l'analyzer `turkish` pose des minuscules de langue"}
            - {nom: "asciifolding"}
            - {nom: "stop", note: "liste explicite, `_none_`, ou le nom d'une des 14 listes servies (`_english_`, `_french_`, `_german_`…). Les listes sont **lues dans le jar de Lucene** du conteneur de référence puis vérifiées mot à mot contre ES, dans les deux sens"}
            - {nom: "stemmer", note: "`language` parmi les 19 noms mesurés identiques à ES (`danish`, `dutch`, `hungarian`, `norwegian`, `romanian`, `russian`, `swedish`, `turkish`, `porter2`, `german`, `spanish`, `italian`, `portuguese`, `english`, `light_french`, `light_german`, `light_spanish`, `light_italian`, `light_portuguese`). ES n'a **aucun** alias à deux lettres : `nl`, `de`, `fr` sont refusés chez lui aussi"}
            - {nom: "porter_stem", note: "le Porter original, cité par son nom de filtre"}
            - {nom: "elision", note: "`articles` (exigé) et `articles_case` — qui veut l'inverse de ce que son nom dit : c'est un `ignoreCase`, donc le défaut (`false`) compare **exactement**, et `L'anno` reste entier"}
            - {nom: "apostrophe"}
            - {nom: "german_normalization"}
            - {texte: "`ngram`, `edge_ngram`", note: "voir la ligne dédiée"}
          refuses:
            - {texte: "les stemmers qu'aucune mesure ne couvre", note: "`finnish` (13 écarts sur 84 399 mots), `french` Snowball (79 sur 21 653 — c'est `light_french` que l'analyzer `french` pose), `dutch_kp`, `kstem`, `light_english`, `minimal_english`, `lovins`, `german2`, `minimal_german`"}
            - {texte: "`stemmer_override`, `keyword_marker`", note: "les quatre mots que `dutch` impose sont posés par son analyzer ; le filtre générique n'est pas écrit"}
            - {texte: "`synonym`, `shingle`, `word_delimiter`, `truncate`…", note: "pas encore écrits"}

      - id: analyse.char_filter
        nom: "`char_filter`"
        etat: refuse
        motif: pas_encore
        poids: 0.2
        raison: >-
          aucun mapping venu d'une instance réelle n'en a encore demandé ; c'est
          une brique à écrire, pas un obstacle.

      - id: analyse.analyzer_parametre
        nom: "Un analyzer de type autre que `custom` (`french`, `standard` paramétré…)"
        etat: refuse
        motif: pas_encore
        poids: null
        raison: >-
          paramétrer un analyzer intégré (`stopwords`, `stem_exclusion`) demande
          de reproduire sa composition interne exacte, qui n'est mesurée que dans
          sa forme par défaut.

  # ---------------------------------------------------------------------------
  - id: types_champ
    entete: ["Type ES", "État", "Traduction tantivy"]
    capacites:

      - id: type.text
        nom: "`text`"
        etat: supporte
        poids: 2.6
        detail: "champ indexé tokenisé (positions + fréquences), tokenizer `default`"

      - id: type.keyword
        nom: "`keyword`"
        etat: supporte
        poids: 2.3
        detail: "champ indexé non tokenisé (`raw`) + fast field (tri)"

      - id: type.entiers
        nom: "`byte`, `short`, `integer`, `long`"
        etat: supporte
        poids: 1.3
        detail: "`i64` indexé + fast. Les bornes du type sont vérifiées à l'indexation"

      - id: type.flottants
        nom: "`float`, `double`"
        etat: partiel
        poids: 0.4
        detail: "`f64` indexé + fast"
        parametres:
          refuses:
            - texte: "la précision d'un `float` **à l'affichage**"
              note: >-
                ES stocke un `float` sur 32 bits et l'imprime avec le plus court
                texte qui y revient (`2894.4688`) ; ferrite le traduit en `f64`
                et l'imprime entier (`2894.46875`). C'est le **même** flottant
                32 bits — vérifié par
                [`fuzz_vs_es.py`](../tests/compat/fuzz_vs_es.py), qui compare
                les deux après arrondi — mais le texte JSON diffère dans un
                `sort` et dans une agrégation

      - id: type.boolean
        nom: "`boolean`"
        etat: supporte
        poids: 0.6
        detail: "`bool` indexé + fast"

      - id: type.date
        nom: "`date`"
        etat: partiel
        poids: 1.7
        detail: >-
          `date` (millisecondes) indexé + fast. **`format` supporté** : motifs
          Java (`yyyy`, `yy`, `MM`, `dd`, `HH`, `hh`, `mm`, `ss`, `SSS`, `a`,
          `Z`, texte entre apostrophes), alternatives `||`, et les noms
          prédéfinis courants (`strict_date_optional_time`, `epoch_millis`,
          `epoch_second`, `date`, `date_time`, `basic_date`…). Le format sert à
          lire (indexation, bornes d'un `range`, ancre d'une expression de date
          math) **et** à rendre (`*_as_string`)
        parametres:
          refuses:
            - {texte: "les lettres de motif non traduites", note: "`G`, `w`, `e`… refusées explicitement plutôt qu'ignorées"}

      - id: type.tableaux
        nom: "Tableaux de valeurs"
        etat: supporte
        poids: null
        detail: "tout champ accepte une valeur ou un tableau"

      - id: type.null
        nom: "`null`"
        etat: supporte
        poids: null
        detail: "ignoré à l'indexation, comme chez ES (pas de `null_value`)"

      - id: type.object
        nom: "`object` (sous-objet), déclaré ou deviné"
        etat: supporte
        poids: 1.3
        detail: >-
          indexé par **chemins pointés** (`client.ville`), comme ES. Un objet
          n'est pas un champ : il n'existe que par ses feuilles. `GET /_mapping`
          re-niche les chemins. Un tableau d'objets est aplati — comme ES, la
          correspondance entre sous-champs d'un même élément est perdue (c'est ce
          que `nested` corrige). La **forme** du document est vérifiée contre
          celle du mapping avant tout le reste, exactement là où ES la vérifie
          — avant `dynamic`, donc `false` et `strict` n'y changent rien : un
          objet posé sur une feuille rend `failed to parse field [a] of type
          [keyword] … Preview of field's value: '{b=x}'`, une valeur posée sur
          un objet rend `object mapping for [a] tried to parse field [a] as
          object, but found a concrete value`, et une fusion de mapping qui
          ferait cohabiter `a` et `a.b` rend `can't merge a non object mapping
          [a] with an object mapping`. Deux différences déclarées avec ES : le
          préfixe `[ligne:colonne]` qu'il place devant (une position dans le
          JSON brut, que ferrite n'a plus une fois le corps parsé) et le
          `caused_by` qu'il joint

      - id: type.nested
        nom: "`nested`"
        etat: partiel
        poids: 0.6
        detail: "voir [la section dédiée](#nested)"

      - id: type.join
        nom: "`join` (parent/enfant)"
        etat: partiel
        poids: null
        detail: "voir [la section dédiée](#join-parentenfant)"

      - id: type.autres
        nom: "Tout autre type (`geo_point`, `ip`, `binary`…)"
        etat: refuse
        motif: pas_encore
        poids: 3.0
        raison: >-
          chacun demande son propre encodage et ses propres requêtes ; aucun
          n'est apparu dans les mappings des instances reprises jusqu'ici.

      - id: type.analyzer
        nom: "`analyzer`"
        etat: partiel
        poids: 0.6
        detail: "sur un champ `text` — voir la section dédiée"
        parametres:
          supportes: ["standard", "simple", "whitespace", "keyword", "stop", "english", "french"]
          refuses:
            - {texte: "les analyzers des autres langues"}

      - id: type.search_analyzer
        nom: "`search_analyzer`"
        etat: supporte
        poids: 0.2
        detail: >-
          l'analyzer du **côté requête**, quand il diffère de celui de
          l'indexation. C'est le compagnon obligé des n-grammes : on indexe en
          grammes, on cherche le mot entier — sans lui, `elan` rend tout ce qui
          commence par `e`. Sur un `text` seulement (ES le refuse ailleurs comme
          un paramètre inconnu, et ferrite reprend sa phrase). `_analyze` avec
          `field`, lui, rejoue l'analyzer d'**indexation** : c'est ce que fait
          ES, mesuré

      - id: type.copy_to
        nom: "`copy_to`"
        etat: supporte
        poids: 0.2
        detail: >-
          recopie la valeur **brute** du champ dans une ou plusieurs cibles à
          l'indexation — c'est ainsi qu'on se refait un `_all`. La cible la lit
          avec **son** type et son analyzer, la copie n'entre pas dans le
          `_source`, et elle ne se **chaîne** pas (la cible d'une cible ne reçoit
          rien). Une cible absente du mapping est créée dynamiquement, au type de
          la valeur copiée. `fields` sur une cible rend les valeurs copiées, la
          valeur propre d'abord puis les sources par ordre de nom. Les trois
          refus d'ES sont repris avec ses phrases : copier depuis ou vers un
          multi-field, vers un objet, ou vers un `nested` qui n'est pas celui de
          la source. Copier vers le **sous-chemin d'une feuille** (`copy_to:
          "a.b"` avec `a` de type `keyword`) est le quatrième, et il ne tombe
          pas au même endroit : ES accepte le mapping et refuse le **document**,
          et seulement s'il porte le champ source — une valeur nulle suffit, un
          tableau vide non (mesure)

      - id: type.store
        nom: "`store`"
        etat: partiel
        poids: 0.1
        detail: >-
          `store: true` conserve la valeur à part du `_source`, et c'est elle que
          `stored_fields` rend — dans l'ordre du document, doublons compris, une
          date au format du champ. `store: false` est le défaut d'ES : il est
          accepté et **non rendu** dans le mapping, comme chez lui. Sous un
          `nested`, `stored_fields` ne rend rien : chez ES la valeur stockée vit
          dans le document enfant, invisible depuis la racine (mesuré). Changer
          `store` sur un champ déjà déclaré n'est pas possible, chez ES non plus
        parametres:
          supportes:
            - {texte: "`true` et `false`, en booléen comme en chaîne"}
            - {texte: "sur un champ ou sur un multi-field"}
          refuses:
            - {nom: "store sur un objet", note: "ES le refuse aussi (« unsupported parameters »)"}

      - id: type.multi_fields
        nom: "Multi-fields (`fields`)"
        etat: supporte
        poids: 0.8
        detail: >-
          un seul niveau, comme ES. `titre.keyword` s'interroge et se trie comme
          un champ à part entière

      - id: type.ignore_above
        nom: "`ignore_above`"
        etat: supporte
        poids: 0.7
        detail: "sur un `keyword` : au-delà, la valeur reste dans `_source` sans être indexée"

      - id: type.index
        nom: "`index`"
        etat: supporte
        poids: 0.4
        detail: >-
          garder un champ **sans le rendre cherchable**. Les deux écritures d'ES
          sont admises (le booléen et la chaîne), et le rendu du mapping suit le
          sien : `index: true` ne laisse rien dans `_mapping` (c'est le défaut),
          `index: false` y est **conservé** — sans quoi un outil qui relit son
          mapping pour décider s'il doit réindexer y lirait le contraire de ce
          qu'il a posé.

          **Un champ `index: false` reste cherchable s'il a une colonne, et
          seul son score change.** C'est la première chose à savoir, parce que
          le nom du paramètre dit le contraire, et parce que c'est ce que rend
          **Elasticsearch 8.15** — la version que ferrite annonce. Un
          Elasticsearch **7.10.2** ne fait pas ça : il y refuse la clause
          (`Cannot search on field [x] since it is not indexed.`) et son
          `_field_caps` annonce `searchable: false`. Le repli sur les *doc
          values* est arrivé entre les deux, et la divergence est chiffrée dans
          [compat-es7.md](compat-es7.md) : **87 cases** sur les 244 de la sonde.
          ferrite suit la 8.15, comme partout ailleurs.

          Ce que le paramètre fait ensuite n'est pas ce que son nom laisse
          croire, et ça a été **mesuré avant d'être écrit**
          ([`sonde_index_false.py`](../tests/compat/sonde_index_false.py), 244
          questions, contre un ES **8.15.0**) : un champ non indexé garde sa
          **colonne**, et Elasticsearch y retombe. Sur un `keyword`, un `long`, un `double`, une
          `date` ou un `boolean`, la recherche continue donc de répondre —
          `term`, `terms`, `range`, `match`, `match_phrase`, `prefix`,
          `wildcard`, `regexp`, `fuzzy`, `exists` — et le tri, les agrégations,
          `fields` et `docvalue_fields` aussi. Le prix est un **balayage** de la
          colonne au lieu d'un saut par l'index, et un **score constant** de 1.0
          (× `boost`) là où un champ indexé est noté par BM25 : une colonne ne
          porte ni fréquence de terme ni longueur de champ. C'est exactement ce
          que rend ES.

          Sur un `text`, il n'y a pas de colonne (ce serait doubler le stockage
          du texte) : le champ n'est plus cherchable du tout, et la clause est
          **refusée** avec la phrase d'ES — `Cannot search on field [x] since it
          is not indexed.`, et sa variante pour une phrase (`was indexed without
          position data`). Deux exceptions mesurées : `exists` y rend 200 et
          **aucun** document, `match_phrase_prefix` aussi. Le surlignage ne rend
          aucun fragment sur un champ non indexé pour un `term`, un `match` ou
          un `range` — il part des `Matches` de Lucene, et une lecture de
          colonne n'en produit pas — mais il en rend un pour la famille des
          **automates** (`terms`, `prefix`, `wildcard`, `regexp`, `fuzzy`), que
          Lucene extrait de la requête sans rien demander à l'index, et
          `no_match_size` s'applique dans tous les cas. Deux bords de plus,
          mesurés parce qu'ils ne se devinent pas : le refus d'une **phrase**
          dépend du nombre de termes (un seul, c'est « pas indexé » ;
          plusieurs, c'est « sans positions » ; zéro, c'est 200 sans document),
          et sur un `boolean` non indexé un `lt` **efface le reste de
          l'intervalle** chez ES — `{"gt": true, "lt": false}` y rend les
          documents à `false`. Ce dernier bord n'existe sur aucun autre type ;
          ferrite le reproduit, parce que rendre **moins** de documents qu'ES
          en silence est pire
        parametres:
          supportes:
            - {texte: "`true` et `false`, en booléen comme en chaîne"}
            - {texte: "sur un champ ou sur un multi-field"}
            - {texte: "`copy_to` depuis **et** vers un champ non indexé", note: "la valeur copiée arrive dans la colonne de la cible, donc elle y est cherchable"}
          refuses:
            - {nom: "index sur un objet ou un nested", note: "ES le refuse aussi (« has unsupported parameters »)  : un objet n'entre pas dans l'index inverse, seules ses feuilles y entrent"}
            - {texte: "`exists` sur un `text` à la fois `index: false` **et** `store: true`", note: "divergence assumée, et c'est **ES** qui échoue : il y rend un 500 (`FieldExistsQuery requires that the field indexes doc values, norms or vectors`) parce que le champ existe dans son index sans y porter de colonne. Le même champ sans `store` rend 200 et aucun document ; ferrite rend cette réponse-là dans les deux cas. Un 500 ne se reproduit pas"}
            - {texte: "`case_insensitive` sur un `regexp` posé sur un champ non indexé", note: "**ES le refuse lui-même** (`Match flags not yet implemented [256]`) : son automate de `regexp` sur une colonne est construit sans les drapeaux de correspondance. `prefix` et `wildcard`, qui passent par un autre chemin, les gardent"}
            - {texte: "changer `index` sur un champ déjà déclaré", note: "dans les deux sens, comme ES (« Cannot update parameter [index] »)"}

      - id: type.autres_parametres
        nom: "Autres paramètres de champ (`null_value`, `doc_values`, `norms`…)"
        etat: refuse
        motif: pas_encore
        poids: 2.8
        raison: >-
          les paramètres acceptés sont `type`, `analyzer`, `search_analyzer`,
          `fields`, `ignore_above`, `format`, `index`, `copy_to` et `store` ;
          les autres sont refusés plutôt qu'acceptés sans effet, faute de quoi
          un `doc_values: false` laisserait croire qu'un champ n'est pas
          triable.

      - id: type.noms_reserves
        nom: "Noms de champ pointés (`a.b`) ou réservés"
        etat: refuse
        motif: divergence_moteur
        poids: 0.0
        raison: >-
          un point est le séparateur de chemin d'un objet : le porter dans un
          nom rendrait ambigu ce qu'un `client.ville` désigne. Le préfixe `_`,
          lui, n'est **pas** réservé — seuls le sont les champs de métadonnées
          d'ES (`_id`, `_source`, `_seq_no`…) et les racines des colonnes
          internes de ferrite (`_elem`, `_nelem`, `_join_parent`), qu'un champ
          utilisateur écraserait.

  # ---------------------------------------------------------------------------
  - id: ingestion
    entete: ["Route", "État", "Détail"]
    capacites:

      - id: ingestion.index_doc
        nom: "`PUT|POST /{index}/_doc/{id}`"
        etat: partiel
        poids: 6.8
        detail: >-
          `_version`, `result`, `_seq_no`, `_primary_term`, `_shards`.
          `op_type=create` honoré
        parametres:
          refuses:
            - {nom: "require_alias", note: "n'écrire que si la cible est un alias"}
            - {nom: "forced_refresh", note: "le champ de la réponse ; ES le rend sous `refresh=wait_for`"}
        conformance: {apis: [index]}

      - id: ingestion.index_doc_sans_id
        nom: "`POST /{index}/_doc`"
        etat: supporte
        poids: null
        detail: "identifiant généré par le serveur"

      - id: ingestion.create
        nom: "`PUT|POST /{index}/_create/{id}`"
        etat: supporte
        poids: 0.5
        detail: "409 `version_conflict_engine_exception` si présent"
        conformance: {apis: [create]}

      - id: ingestion.get
        nom: "`GET /{index}/_doc/{id}`"
        etat: supporte
        poids: 0.7
        detail: >-
          temps réel : une écriture non rafraîchie est visible. `_source_includes`
          / `_source_excludes` / `_source` supportés, et `?stored_fields=` rend
          les champs déclarés [`store: true`](#types-de-champ) — il retire alors
          le `_source`, comme sur une recherche
        conformance: {apis: [get]}

      - id: ingestion.exists
        nom: "`HEAD /{index}/_doc/{id}`"
        etat: supporte
        poids: 0.0
        conformance: {apis: [exists]}

      - id: ingestion.delete
        nom: "`DELETE /{index}/_doc/{id}`"
        etat: supporte
        poids: 0.1
        detail: "404 + `result: not_found` si absent, `_version` reste monotone"
        conformance: {apis: [delete]}

      - id: ingestion.bulk
        nom: "`POST|PUT /_bulk`, `/{index}/_bulk`"
        etat: partiel
        poids: 1.1
        detail: >-
          NDJSON, actions `index` / `create` / `delete` / `update`, statut et
          erreur **par item**
        parametres:
          supportes:
            - {nom: "_index", note: "métadonnée d'action"}
            - {nom: "_id", note: "métadonnée d'action ; toute **valeur simple** est convertie en texte comme chez ES (`42` → `\"42\"`), un objet ou un tableau est refusé"}
          refuses:
            # Nommées une par une, et pas seulement « les autres » : c'est ce
            # que `perimetre.py` sait lire, donc la différence entre un refus
            # **déclaré** et un échec compté en régression. La suite du client
            # go en exerce trois (`version`, `version_type`, `require_alias`) ;
            # sans ces lignes, elles remontaient comme des régressions.
            - {nom: "version"}
            - {nom: "version_type"}
            - {nom: "require_alias"}
            - {nom: "_routing"}
            - {nom: "routing"}
            - {nom: "if_seq_no"}
            - {nom: "if_primary_term"}
            - {nom: "pipeline"}
            - {nom: "retry_on_conflict"}
            - {nom: "dynamic_templates"}
        conformance: {apis: [bulk]}

      - id: ingestion.refresh
        nom: "`refresh` (`true` / `false` / `wait_for`)"
        etat: supporte
        poids: null
        detail: "`wait_for` est traité comme `true` : le commit est synchrone et mono-shard"

      - id: ingestion.update
        nom: "`POST /{index}/_update/{id}`"
        etat: partiel
        poids: 0.7
        parametres:
          supportes:
            - {nom: "doc", note: "fusion partielle"}
            - {nom: "upsert"}
            - {nom: "doc_as_upsert"}
            - {nom: "detect_noop"}
          refuses:
            - {nom: "script", note: "voir le scripting, hors périmètre"}
            - {nom: "_source", note: "filtrer la réponse d'un `_update`"}
            - {nom: "require_alias"}
        conformance: {apis: [update]}

      - id: ingestion.mget
        nom: "`GET|POST /_mget`, `/{index}/_mget`"
        etat: supporte
        poids: 0.2
        detail: >-
          formes `ids` et `docs`, filtrage de `_source`, erreur par document, et
          `stored_fields` — en query string pour tout le lot, ou par descripteur,
          le sien l'emportant. Un `_id` **numérique** est lu comme la chaîne
          correspondante, comme chez ES
        conformance: {apis: [mget]}

      - id: ingestion.count
        nom: "`GET|POST /{index}/_count`"
        etat: supporte
        poids: 0.4
        detail: "avec ou sans `query`"
        conformance: {apis: [count]}

      - id: ingestion.versionnage
        nom: "Versionnage optimiste `if_seq_no` / `if_primary_term`"
        etat: supporte
        poids: null
        detail: "409 `version_conflict_engine_exception` si le document a bougé"

      - id: ingestion.version_externe
        nom: "`version` / `version_type` externes"
        etat: refuse
        motif: pas_encore
        poids: null
        raison: >-
          la version d'un document est gérée par ferrite ; l'imposer de
          l'extérieur demande de tenir un ordre que le serveur ne contrôle plus,
          et rien ne l'a encore réclamé.
        conformance: {erreurs: ["unrecognized parameter: \\[version(_type)?\\]"]}

      - id: ingestion.delete_by_query
        nom: "`POST /{index}/_delete_by_query`"
        etat: partiel
        poids: 0.4
        detail: >-
          purge par requête, synchrone. La réponse porte les compteurs d'ES —
          `total`, `deleted`, `batches`, `version_conflicts`, `noops`,
          `retries`, `failures[]` — et son statut passe à **409** dès qu'un
          conflit n'est pas absorbé par `conflicts=proceed`. Le relevé se fait
          sur l'instantané de la recherche, et chaque écriture est conditionnée
          par le `_seq_no` observé : c'est ce qui produit les
          `version_conflicts`, comme chez ES
        parametres:
          supportes:
            - {nom: "query", note: "obligatoire — sans lui, 400 `query is missing`"}
            - {nom: "conflicts", note: "`abort` (défaut) / `proceed`, en paramètre ou dans le corps"}
            - {nom: "max_docs", note: "en paramètre ou dans le corps ; les deux à des valeurs différentes = 400"}
            - {nom: "scroll_size", note: "1 à 10 000 ; change `batches` et l'endroit où `abort` s'arrête"}
            - {nom: "refresh", note: "`true` / `false` seulement — `wait_for` y est refusé, comme chez ES"}
            - {nom: "wait_for_completion", note: "`true` seulement"}
            - {nom: "slices", note: "`1` seulement — la valeur par défaut"}
            - {nom: "requests_per_second", note: "`-1` seulement — la valeur par défaut"}
            - {texte: "les tolérances d'expression d'index", note: "`ignore_unavailable`, `allow_no_indices`, `expand_wildcards`"}
          refuses:
            - {nom: "wait_for_completion=false", note: "il rend une **tâche**, et ferrite n'a pas d'API `_tasks`"}
            - {nom: "slices", note: "> 1 ou `auto` : des tâches parallèles, et une section `slices` en plus dans la réponse"}
            - {nom: "slice", note: "dans le corps — une tranche n'a de sens qu'à plusieurs"}
            - {nom: "requests_per_second", note: "il régule le débit et remplit `throttled_millis`, que ferrite rendrait à zéro"}
            - {nom: "terminate_after", note: "il arrête la recherche sans arrêter l'écriture : `total` ne dirait plus ce qu'il dit"}
            - {nom: "sort", note: "dans le corps — il choisit **quels** documents `max_docs` retient"}
            - {nom: "size", note: "l'ancien nom de `scroll_size` dans le corps"}
            - {texte: "la recherche par chaîne", note: "`q`, `df`, `analyzer`, `default_operator`, `lenient`, `analyze_wildcard`"}
            - {nom: "routing", note: "ferrite est mono-shard, il n'y a rien à choisir"}
            - {texte: "les paramètres de la recherche interne", note: "`scroll`, `search_timeout`, `search_type`, `request_cache`, `stats`, `version` — la commande ne rend aucun document"}
        conformance:
          apis: [delete_by_query]

      - id: ingestion.update_by_query
        nom: "`POST /{index}/_update_by_query`"
        etat: partiel
        poids: 0.3
        detail: >-
          **sans script**, la route réindexe depuis le `_source` — le geste
          utile après un `PUT /{index}/_mapping`. La réponse porte `updated` en
          plus des compteurs de `_delete_by_query` ; `noops` reste à 0, parce
          qu'ES n'en compte que sur ordre d'un script. Sans corps du tout, la
          requête vaut `match_all` (contrairement à `_delete_by_query`, où
          l'absence de `query` est une erreur)
        parametres:
          supportes:
            - {nom: "query", note: "facultatif ici — absent, il vaut `match_all`"}
            - {nom: "conflicts", note: "`abort` (défaut) / `proceed`, en paramètre ou dans le corps"}
            - {nom: "max_docs", note: "en paramètre ou dans le corps"}
            - {nom: "scroll_size", note: "1 à 10 000"}
            - {nom: "refresh", note: "`true` / `false` seulement"}
            - {nom: "wait_for_completion", note: "`true` seulement"}
            - {nom: "slices", note: "`1` seulement — la valeur par défaut"}
            - {nom: "requests_per_second", note: "`-1` seulement — la valeur par défaut"}
            - {texte: "les tolérances d'expression d'index", note: "`ignore_unavailable`, `allow_no_indices`, `expand_wildcards`"}
          refuses:
            - {nom: "script", note: "c'est Painless, hors périmètre — y compris un objet `script` vide"}
            - {nom: "pipeline", note: "les pipelines d'ingestion sont hors périmètre"}
            - {nom: "wait_for_completion=false", note: "il rend une **tâche**, et ferrite n'a pas d'API `_tasks`"}
            - {nom: "slices", note: "> 1 ou `auto`"}
            - {nom: "slice", note: "dans le corps"}
            - {nom: "requests_per_second", note: "il régule le débit et remplit `throttled_millis`"}
            - {nom: "terminate_after"}
            - {nom: "sort", note: "dans le corps"}
            - {nom: "size", note: "l'ancien nom de `scroll_size` dans le corps"}
            - {texte: "la recherche par chaîne", note: "`q`, `df`, `analyzer`, `default_operator`, `lenient`, `analyze_wildcard`"}
            - {nom: "routing", note: "ferrite est mono-shard, il n'y a rien à choisir"}
            - {texte: "les paramètres de la recherche interne", note: "`scroll`, `search_timeout`, `search_type`, `request_cache`, `stats`, `version` — la commande ne rend aucun document"}
        conformance:
          apis: [update_by_query]

      - id: ingestion.reecriture_en_masse
        nom: "`_reindex`, pipelines d'ingestion"
        etat: refuse
        motif: pas_encore
        poids: 3.0
        raison: >-
          `_reindex` copie d'un index vers un autre, et son intérêt est
          justement ce que ferrite n'a pas : une source distante, un pipeline,
          un script. Rien ne s'y oppose, ce n'est pas écrit — et `scroll` +
          `_bulk` le font aujourd'hui côté client, ce que ni
          `_delete_by_query` ni `_update_by_query` ne permettaient.
        conformance:
          apis: [reindex, reindex_rethrottle, delete_by_query_rethrottle,
                 update_by_query_rethrottle, "ingest.*", "simulate.*"]

  # ---------------------------------------------------------------------------
  - id: scroll
    entete: ["Route / paramètre", "État", "Détail"]
    capacites:

      - id: scroll.ouverture
        nom: "`?scroll=1m` sur `_search`"
        etat: supporte
        poids: null
        detail: >-
          ouvre un contexte et rend `_scroll_id`. Durées d'ES (`30s`, `1m`, `2h`,
          `500ms`…) ; sans unité, ❌ avec le message d'ES

      - id: scroll.page
        nom: "`POST|GET /_search/scroll`"
        etat: supporte
        poids: 0.0
        detail: >-
          `{"scroll_id": "...", "scroll": "1m"}`, ou en query string. Le
          `keep_alive` est repoussé à chaque page
        conformance: {apis: [scroll]}

      - id: scroll.page_heritee
        nom: "`POST|GET /_search/scroll/{scroll_id}`"
        etat: supporte
        poids: null
        detail: "la forme héritée, identifiant dans l'URL"

      - id: scroll.fermeture
        nom: "`DELETE /_search/scroll`, `/_search/scroll/{scroll_id}`"
        etat: supporte
        poids: 0.1
        detail: >-
          une liste d'identifiants ou `_all` ; `{"succeeded": true, "num_freed": n}`.
          Fermer deux fois n'est pas une erreur
        conformance: {apis: [clear_scroll]}

      - id: scroll.from
        nom: "`from` avec `scroll`"
        etat: refuse
        motif: comme_es
        poids: null
        raison: "comme ES : `action_request_validation_exception`."

      - id: scroll.contexte_absent
        nom: "Contexte expiré, fermé, ou jamais ouvert"
        etat: refuse
        motif: comme_es
        poids: null
        raison: >-
          **404** `search_phase_execution_exception`, cause
          `search_context_missing_exception` — la forme exacte d'ES, celle que
          les clients reconnaissent.

  # ---------------------------------------------------------------------------
  - id: expressions_index
    entete: ["Forme", "État", "Ce qu'elle désigne"]
    capacites:

      - id: expr.nom
        nom: "`catalogue`"
        etat: supporte
        poids: null
        detail: "l'index, ou l'alias, de ce nom"

      - id: expr.liste
        nom: "`produits,marques`"
        etat: supporte
        poids: 0.6
        detail: "les deux — c'est ce qu'envoie `es.search(index=[\"produits\",\"marques\"])`"

      - id: expr.joker
        nom: "`audits-2026.08.*`"
        etat: supporte
        poids: 0.4
        detail: "les index **et les alias** dont le nom correspond"

      - id: expr.all
        nom: "`_all`, `*`, URL sans index"
        etat: supporte
        poids: 4.1
        detail: "tous les index"

      - id: expr.exclusion
        nom: "`audits-*,-audits-2026.07.*`"
        etat: supporte
        poids: 0.0
        detail: "les premiers, moins les seconds"

      - id: expr.ignore_unavailable
        nom: "`ignore_unavailable`"
        etat: supporte
        poids: null
        detail: "un nom concret absent est ignoré au lieu d'être une erreur"

      - id: expr.allow_no_indices
        nom: "`allow_no_indices`"
        etat: supporte
        poids: null
        detail: "défaut `true` : un motif sans correspondance rend 0 résultat, pas 404"

      - id: expr.expand_wildcards
        nom: "`expand_wildcards`"
        etat: partiel
        poids: null
        detail: >-
          ferrite n'a ni index fermé ni index caché : `closed` seul ne désigne
          donc rien
        parametres:
          supportes:
            - {nom: "open"}
            - {nom: "hidden"}
            - {nom: "all"}
            - {nom: "closed", note: "accepté, ne désigne rien"}
          refuses: ["none"]

  # ---------------------------------------------------------------------------
  - id: alias
    entete: ["Route", "État", "Détail"]
    capacites:

      - id: alias.aliases
        nom: "`POST /_aliases`"
        etat: partiel
        poids: 0.3
        detail: >-
          `index`/`indices` et `alias`/`aliases` au singulier comme au pluriel,
          motifs compris. Tout ou rien, comme chez ES — c'est ce qui rend une
          bascule atomique. Un `remove` **désigne** des alias plutôt qu'il ne
          les nomme (`test_alias*`, `_all`), et ses deux règles de 404 ne sont
          pas la même : `must_exist: true` se vérifie **par index visé** — un
          `remove` sur `logs-*` échoue dès qu'un seul des index ne porte pas
          l'alias —, alors que le 404 par défaut est **global**, il ne tombe que
          si toute la requête finit sans rien faire (mesuré,
          `tests/compat/sonde_ecriture_alias.py`). Un seul écart assumé, sur
          l'**ordre** : quand plusieurs noms manquent, ES les rend dans l'ordre
          d'itération d'un `HashSet` de Java (`[ab1, ab2]` écrit ressort
          `[ab2, ab1]`), qui n'est l'ordre de rien — ferrite rend l'ordre écrit,
          et les noms sont les mêmes
        parametres:
          supportes: ["add", "remove", "remove_index", "must_exist"]
          refuses:
            - {nom: "filter"}
            - {nom: "routing", note: "`index_routing`, `search_routing`"}
        conformance: {apis: [indices.update_aliases]}

      - id: alias.put
        nom: >-
          `PUT|POST /{index}/_alias/{nom}` et ses six autres URL
          (`/_alias/{nom}`, `/{index}/_alias`, `/_alias`, `_aliases` pour
          chacune)
        etat: supporte
        poids: 0.1
        detail: >-
          `{index}` est une expression ; `{nom}` est un nom, et un seul (une
          virgule y rend `Invalid alias name`, comme chez ES). Le nom de
          l'alias, celui de l'index, ou les deux, peuvent venir du **corps**, et
          le corps **remplace** alors le chemin — `PUT /inconnu/_alias/a` avec
          `{"index": "reel"}` pose l'alias sur `reel`, en 200. Deux refus
          assumés dans ce corps, tous deux du côté sûr : ES n'y lit que `index`
          et `alias` au **singulier** (un `indices`/`aliases` y est ignoré, et
          sort en « [indices] can't be empty »), et d'une **liste** JSON il ne
          garde que le dernier élément, en 200 — recopier ça poserait l'alias
          ailleurs que là où le corps le demande, sans un mot
        conformance: {apis: [indices.put_alias]}

      - id: alias.delete
        nom: "`DELETE /{index}/_alias/{nom}`"
        etat: supporte
        poids: 0.0
        detail: "`{nom}` accepte un motif"
        conformance: {apis: [indices.delete_alias]}

      - id: alias.get
        nom: "`GET /_alias`, `/_alias/{nom}`, `/{index}/_alias`, `/{index}/_alias/{nom}`"
        etat: supporte
        poids: 0.1
        detail: >-
          `{nom}` est une **expression** (liste, jokers, exclusions, `_all`) —
          voir ci-dessous — y compris le 404 « à corps de chaîne » d'ES
          (`{"error": "alias [x] missing", "status": 404}`), qui porte quand même
          les alias trouvés
        conformance: {apis: [indices.get_alias]}

      - id: alias.head
        nom: "`HEAD /_alias/{nom}`, `/{index}/_alias/{nom}`"
        etat: supporte
        poids: 0.0
        conformance: {apis: [indices.exists_alias]}

      - id: alias.a_la_creation
        nom: "`aliases` dans `PUT /{index}`"
        etat: supporte
        poids: null
        detail: >-
          posé après la création ; un alias refusé annule la création plutôt que
          de laisser une demande à moitié faite

      - id: alias.is_write_index
        nom: "`is_write_index`"
        etat: supporte
        poids: null
        detail: "désigne l'index qui reçoit les écritures quand l'alias en couvre plusieurs"

      - id: alias.suppression_par_alias
        nom: "`DELETE /{alias}`"
        etat: refuse
        motif: comme_es
        poids: null
        raison: >-
          effacer des index que le client n'a pas nommés n'est pas une
          suppression, c'est un accident ; ES 8 refuse de la même façon (« The
          provided expression [x] matches an alias, specify the corresponding
          concrete indices instead »).
        conformance:
          erreurs: ["matches an alias, specify the corresponding concrete indices"]

      - id: alias.filtre_et_routage
        nom: "`filter`, `routing`, `index_routing`, `search_routing` sur un alias"
        etat: refuse
        motif: pas_encore
        poids: null
        raison: >-
          un alias filtré dont le filtre n'est pas appliqué rendrait précisément
          les documents qu'il est censé cacher ; le routage, lui, n'a rien à
          choisir sur un mono-shard.
        conformance:
          erreurs: ["ferrite ne supporte pas .{0,40}\\[(filter|routing|index_routing|search_routing)\\]"]

  # ---------------------------------------------------------------------------
  - id: alias_conformance
    entete: ["Ce que c'est", "État", "Détail"]
    capacites:

      - id: alias.cat_aliases
        nom: "`GET /_cat/aliases`"
        etat: refuse
        motif: pas_encore
        poids: 0.0
        raison: >-
          route absente (`no handler found`) ; ses tests exigent en plus `h=`,
          `s=` et `help` sur les `_cat`, que ferrite n'a pas — 10 cas de la suite
          d'Elastic tombent dessus.
        conformance: {apis: [cat.aliases]}

      - id: alias.remove_index_et_add
        nom: "`remove_index` **et** `add` d'un alias du même nom dans le même `POST /_aliases`"
        etat: refuse
        motif: pas_encore
        poids: null
        raison: >-
          refusé en 400 (« an index or data stream exists with the same name as
          the alias ») : ferrite applique les alias avant les suppressions, là où
          ES calcule tout l'état puis l'applique — c'est pourtant l'usage même de
          `remove_index`.
        conformance: {erreurs: ["an index or data stream exists with the same name as the alias"]}

      - id: alias.index_ferme
        nom: "`GET /{index}/_alias` sur un index **fermé**"
        etat: refuse
        motif: pas_encore
        poids: null
        raison: "`_close` / `_open` sont hors périmètre, donc un index fermé n'existe pas ici."

  # ---------------------------------------------------------------------------
  - id: reglages_cluster
    entete: ["", "État", "Détail"]
    capacites:

      - id: reglages.route
        nom: "`GET|PUT /_cluster/settings`"
        etat: partiel
        poids: 1.7
        detail: >-
          `persistent` et `transient` (le second l'emporte), écriture plate ou
          imbriquée
        parametres:
          supportes: ["action.destructive_requires_name"]
          refuses:
            - {texte: "tout autre réglage", note: "refusé avec le message d'ES (`not recognized`)"}
            - {nom: "flat_settings", note: "il aplatit les clés de la réponse, ferrite la rendrait imbriquée"}
            - {nom: "include_defaults", note: "il ajoute la section `defaults` du cluster"}
        conformance:
          apis: [cluster.get_settings, cluster.put_settings]
          erreurs:
            - "(transient|persistent) setting \\[.*\\], not recognized"
            - "ne supporte pas \\[(flat_settings|include_defaults)\\] sur \\[(GET|PUT) /_cluster/settings\\]"

      - id: reglages.destructive_requires_name
        nom: "`action.destructive_requires_name`"
        etat: supporte
        poids: null
        detail: "`true` par défaut, **comme ES depuis la 8.0**"
        conformance: {erreurs: ["Wildcard expressions or all indices are not allowed"]}

  # ---------------------------------------------------------------------------
  - id: dsl
    entete: ["Clause", "État", "Détail"]
    capacites:

      - id: dsl.match_all
        nom: "`match_all`"
        etat: supporte
        poids: 3.3
        detail: "`boost`"

      - id: dsl.match_none
        nom: "`match_none`"
        etat: supporte
        poids: 0.0

      - id: dsl.match
        nom: "`match`"
        etat: partiel
        poids: 6.8
        detail: >-
          sur un champ non analysé, se comporte comme `term`. Voir [la recherche
          libre](#la-recherche-libre-multi_match) pour `lenient`
        parametres:
          supportes:
            - {nom: "query"}
            - {nom: "operator", note: "`or` / `and`"}
            - {nom: "boost"}
            - {nom: "lenient"}
          refuses: ["fuzziness", "minimum_should_match", "analyzer", "zero_terms_query",
                    "prefix_length", "auto_generate_synonyms_phrase_query",
                    "fuzzy_transpositions", "max_expansions"]

      - id: dsl.multi_match
        nom: "`multi_match`"
        etat: partiel
        poids: 0.9
        detail: "voir [la recherche libre](#la-recherche-libre-multi_match)"
        parametres:
          supportes:
            - {nom: "query"}
            - {nom: "fields", note: "**obligatoire**, avec la pondération `champ^3`"}
            - {nom: "type", note: "`best_fields` (défaut), `most_fields`, `phrase`, `phrase_prefix`"}
            - {nom: "operator"}
            - {nom: "tie_breaker", note: "sur `best_fields`, `phrase` et `phrase_prefix` ; refusé sur `most_fields`, où ES l'accepte sans effet"}
            - {nom: "lenient"}
            - {nom: "max_expansions"}
            - {nom: "boost"}
          refuses:
            - {texte: "`type: cross_fields`"}
            - {texte: "`type: bool_prefix`"}
            - {nom: "slop"}
            - {texte: "les motifs de champ", note: "`tit*`"}
            - {nom: "minimum_should_match"}
            - {nom: "analyzer"}

      - id: dsl.match_phrase
        nom: "`match_phrase`"
        etat: partiel
        poids: 4.5
        detail: >-
          les termes dans l'ordre, adjacents. Sur un champ dont l'analyzer pose
          plusieurs termes à la **même position** (un filtre `ngram` ou
          `edge_ngram`), un mot **seul** passe — ce sont des alternatives, et
          ferrite en fait l'union comme Lucene ; **plusieurs mots** sont refusés
          explicitement (Lucene y construit une `MultiPhraseQuery` que tantivy
          n'a pas, et les enchaîner rendrait moins de documents en silence)
        parametres:
          supportes: ["query", "boost"]
          refuses:
            - {nom: "slop", note: "voir les divergences"}
            - {nom: "analyzer"}
            - {texte: "plusieurs mots sur un champ à n-grammes", note: "voir le détail ci-dessus"}

      - id: dsl.match_phrase_prefix
        nom: "`match_phrase_prefix`"
        etat: partiel
        poids: 0.1
        detail: >-
          les termes dans l'ordre, le dernier n'étant qu'un début de mot. Sur un
          champ `keyword`, refusée avec le message d'ES (« Can only use phrase
          prefix queries on text fields »)
        parametres:
          supportes:
            - {nom: "query"}
            - {nom: "max_expansions", note: "défaut 50, comme ES"}
            - {nom: "boost"}
          refuses:
            - {nom: "slop"}
            - {nom: "analyzer"}
            - {nom: "zero_terms_query"}
            - {texte: "plusieurs mots sur un champ à n-grammes", note: "même raison que pour `match_phrase` ; un mot seul passe, chaque n-gramme y étant développé par son préfixe"}

      - id: dsl.exists
        nom: "`exists`"
        etat: partiel
        poids: 2.6
        detail: >-
          sur tous les types, y compris `text`. Un champ absent, `null`, ou un
          tableau vide compte comme absent, comme chez ES
        parametres:
          refuses:
            - texte: "sur un `text` dont la valeur ne produit **aucun terme**"
              note: >-
                une chaîne vide, des espaces, de la ponctuation seule : ES tient
                un `_field_names` et compte le champ présent dès qu'il est dans
                `_source` ; ferrite lit l'index inversé, où ces valeurs n'ont
                rien laissé, et rend donc **moins** de documents. Le corriger
                demanderait de stocker les valeurs de chaque champ `text` une
                seconde fois, en colonne — trouvé par
                [`fuzz_vs_es.py`](../tests/compat/fuzz_vs_es.py)

      - id: dsl.term
        nom: "`term`"
        etat: supporte
        poids: 3.0
        detail: >-
          forme courte et forme `{value, boost}`. Sur un champ `date`, la valeur
          désigne la **période** qu'elle couvre, pas un instant, et le date math y
          est accepté (comme chez ES). `case_insensitive` ❌

      - id: dsl.ids
        nom: "`ids`"
        etat: supporte
        poids: 0.0
        detail: "`values`, `boost`"

      - id: dsl.prefix
        nom: "`prefix`"
        etat: partiel
        poids: 0.3
        detail: "non analysée comme chez ES"
        parametres:
          supportes:
            - {nom: "value"}
            - {nom: "case_insensitive", note: "repliement ASCII, comme ES"}
            - {nom: "boost"}
          refuses: ["rewrite"]

      - id: dsl.wildcard
        nom: "`wildcard`"
        etat: partiel
        poids: 0.0
        detail: "`*`, `?`, et `\\` qui échappe le caractère suivant"
        parametres:
          supportes: ["value", "case_insensitive", "boost"]
          refuses: ["rewrite"]

      - id: dsl.regexp
        nom: "`regexp`"
        etat: partiel
        poids: 0.0
        detail: "syntaxe **Lucene**, ancrée des deux côtés (voir les divergences)"
        parametres:
          supportes: ["value", "flags", "case_insensitive", "boost"]
          refuses:
            - {texte: "les opérateurs `~`, `&`, `<n-m>`, `#`", note: "refusés explicitement, jamais pris pour des littéraux"}
            - {nom: "rewrite"}
            - {nom: "max_determinized_states"}

      - id: dsl.fuzzy
        nom: "`fuzzy`"
        etat: partiel
        poids: 0.0
        parametres:
          supportes:
            - {nom: "value"}
            - {nom: "fuzziness", note: "`AUTO` ou distance entière"}
            - {nom: "transpositions"}
            - {nom: "boost"}
          refuses: ["prefix_length", "max_expansions", "rewrite"]

      - id: dsl.meta_champs
        nom: "les champs de **métadonnées** en clause (`_id`, `_index`, …)"
        etat: partiel
        poids: null
        detail: >-
          `{"term": {"_id": "…"}}` rendait `hits.total: 0` **sans erreur** pour
          un document qui existe : le nom n'était dans aucun mapping, la clause
          tombait donc dans « champ non mappé », que le défaut d'ES
          (`allow_unmapped_fields`) transforme en « ne correspond à rien ». Un
          vide indiscernable d'un document absent, en 200. Ce que fait ES n'est
          pas « répondre partout » : les 203 questions de
          [`sonde_meta_champs.py`](../tests/compat/sonde_meta_champs.py) rangent
          chaque case dans **trois** issues — il répond, il refuse, il rend vide
          — et ferrite suit les trois. Deux règles mesurées qu'aucune
          documentation ne donne : `match` sur `_id` **n'analyse pas** la valeur
          (`"a b"` y rend zéro document), et une clause sur `_index` lit une
          **expression de nom d'index** (`{"term": {"_index": "logs-*"}}` rend
          les documents de `logs-2026`), où seule l'étoile est un joker —
          `?` y est un caractère ordinaire et `\` n'échappe rien. Voir
          [`src/meta.rs`](../src/meta.rs)
        parametres:
          supportes:
            - {nom: "_id", note: "`term`, `terms`, `match`, `match_phrase`, `multi_match` et `exists` répondent, à score **constant** (1.0 × `boost`) ; `prefix`, `wildcard`, `regexp`, `fuzzy`, `match_phrase_prefix` et `range` y sont **refusés avec la phrase d'ES** (« not on [_id] which is of type [_id] »), parce qu'ES les refuse. `fields` rend l'identifiant"}
            - {nom: "_index", note: "les mêmes clauses, plus `prefix` et `wildcard` : la valeur est une expression de nom d'index, donc la clause vaut « tous les documents de cet index » ou « aucun ». C'est son seul usage réel — filtrer un index dans une recherche qui en vise plusieurs. Une valeur qui commence par `_` n'est **pas** un nom valide et ES la refuse (`invalid_index_name_exception` / « Invalid index name [_doc], must not start with '_'. ») ; la seule exception est `_all` **exactement**, qui désigne tous les index. Mesuré, et trouvé par le fuzzer : ferrite y rendait vide"}
            - {nom: "_type", note: "rend **vide** en 200, comme ES depuis la 8.0 : la parité y est le vide, et en faire une erreur serait une divergence introduite"}
            - {nom: "_source", note: "refusé avec les phrases d'ES (« The _source field is not searchable », « does not support match queries »)"}
            - {nom: "_field_names", note: "les clauses de terme y rendent vide, `exists` y est refusé par la phrase d'ES (« Cannot run exists query on _field_names »)"}
            - {nom: "_version", note: "refusé en clause avec la phrase d'ES (« The _version field is not searchable ») ; `exists` rend tous les documents"}
          refuses:
            - {nom: "_routing", note: "ferrite est mono-shard et refuse `?routing=` à l'indexation : **aucun** document n'en porte, donc rendre vide serait indiscernable d'un document sans routage. ES y répond en `term`, `terms`, `match`, les motifs, `range` et `exists`"}
            - {nom: "_seq_no", note: "le numéro de séquence est tenu (il sert de condition de concurrence) mais n'est pas interrogeable ; ES y répond en `term`, `range`, tri et agrégation. `exists` seul est servi — chaque document en porte un"}
            - {nom: "_ignored", note: "ferrite ne tient pas la liste des valeurs qu'un `ignore_above` a écartées ; ES y répond sur toutes les clauses"}
            - {texte: "le **tri**, l'**agrégation** et `docvalue_fields` sur un champ de métadonnées", note: "ES les sert sur `_index`, `_seq_no`, `_version` et `_ignored` (et les refuse sur `_id`, `_source` et `_field_names`) ; ferrite les refuse tous en les nommant. Ce sont les clauses de requête qui sont servies, pas les lectures de colonne"}
        conformance:
          erreurs:
            - "ferrite ne supporte pas le champ de metadonnees \\[_[a-z_]+\\]"

      - id: dsl.constant_score
        nom: "`constant_score`"
        etat: supporte
        poids: 0.2
        detail: "`filter`, `boost`"

      - id: dsl.dis_max
        nom: "`dis_max`"
        etat: supporte
        poids: 0.1
        detail: "`queries`, `tie_breaker`, `boost` — voir [`src/dismax.rs`](../src/dismax.rs)"

      - id: dsl.function_score
        nom: "`function_score`"
        etat: partiel
        poids: 0.4
        detail: >-
          le réglage de la pertinence : « le même match, mais les articles
          récents devant ». Les trois briques de calcul — les fonctions de
          décroissance, les modificateurs de `field_value_factor` et les six
          `boost_mode` — sont **verrouillées contre les classes d'Elasticsearch
          elles-mêmes**, exécutées dans le conteneur de référence
          ([`genere_scoring.py`](../tests/compat/genere_scoring.py), 47 184
          points rejoués par `cargo test`). Voir [la section
          dédiée](#function_score-et-boosting)
        parametres:
          supportes:
            - {nom: "query", note: "facultative ; sans elle, `match_all`"}
            - {nom: "functions", note: "avec `filter` et `weight` par entrée"}
            - {nom: "weight"}
            - {nom: "field_value_factor", note: "`field`, `factor`, `modifier` (les dix), `missing` — sur un champ numérique, `date` ou `boolean`"}
            - {nom: "gauss", note: "sur un champ numérique, `date` ou `boolean` ; `origin`, `scale`, `offset`, `decay`. Sur une `date`, `origin` accepte le date math et vaut `now` par défaut, `scale` et `offset` sont des durées"}
            - {nom: "exp", note: "mêmes paramètres que `gauss`"}
            - {nom: "linear", note: "mêmes paramètres que `gauss`"}
            - {nom: "score_mode", note: "`multiply`, `sum`, `avg`, `first`, `max`, `min` — **ignoré** quand il n'y a qu'une fonction sans `filter`, comme chez ES (mesuré)"}
            - {nom: "boost_mode", note: "`multiply`, `replace`, `sum`, `avg`, `max`, `min`"}
            - {nom: "max_boost"}
            - {nom: "min_score", note: "comparé au score **après** le `boost` de la clause, comme chez ES (mesuré)"}
            - {nom: "boost"}
          refuses:
            - {nom: "random_score", note: "un score tiré au sort ne se reproduit pas d'un moteur à l'autre : il faudrait reproduire le hachage de Lucene sur des identifiants internes qui ne sont pas les mêmes"}
            - {nom: "script_score", note: "suppose Painless, un langage à part entière"}
            - {nom: "boost_factor", note: "**ES 8.15 le refuse aussi** (`field [boost_factor] is not supported`), et ferrite rend la même phrase : il a disparu en 5.0"}
            - {nom: "multi_value_mode", note: "seul le défaut d'ES est servi — `min`, appliqué à la **distance** et non à la valeur"}
            - {texte: "plusieurs champs dans une même décroissance", note: "ES en applique **un seul** sans dire lequel (mesuré) ; le reproduire demanderait de deviner"}
            - {texte: "une décroissance sur un champ non mappé", note: "ES la refuse aussi (`unknown field [x]`) — son `field_value_factor`, lui, l'accepte et sert son `missing`, et ferrite fait pareil"}

      - id: dsl.boosting
        nom: "`boosting`"
        etat: supporte
        poids: 0.0
        detail: >-
          la démotion sans exclusion : `positive`, `negative`, `negative_boost`
          (obligatoire et positif, comme chez ES), `boost`. L'ensemble rendu est
          **exactement** celui de `positive`

      - id: dsl.terms
        nom: "`terms`"
        etat: partiel
        poids: 0.2
        detail: >-
          liste de valeurs, score constant comme chez ES. Sur un champ `date`,
          chaque valeur est une période, comme dans `term`
        parametres:
          refuses:
            - {texte: "les *terms lookup*", note: "lire la liste des valeurs dans un autre document"}

      - id: dsl.range
        nom: "`range`"
        etat: partiel
        poids: 11.4
        detail: >-
          sur `keyword` / numérique / `date` / `boolean`. Sur un champ `date`, les
          bornes acceptent le **date math** (`now`, `now-1d/d`, `2026-03-15||+1M`)
          et sont **arrondies selon leur côté** — voir [la section
          dédiée](#date-math-et-arrondi-des-bornes)
        parametres:
          supportes:
            - {nom: "gte"}
            - {nom: "gt"}
            - {nom: "lte"}
            - {nom: "lt"}
            - {nom: "boost"}
            - {nom: "format", note: "lecture des bornes"}
            - {nom: "time_zone", note: "la borne est résolue **dans le fuseau**, arrondi compris — voir [la section dédiée](#date-math-et-arrondi-des-bornes). Sur un champ qui n'est pas une date, il est accepté sans effet, comme chez ES (mesuré)"}
          refuses:
            - {nom: "relation"}
            - {texte: "un `range` sur un champ `text`"}

      - id: dsl.bool
        nom: "`bool`"
        etat: partiel
        poids: 12.1
        detail: >-
          `filter` ne contribue pas au score. Un `bool` qui n'a que des
          `must_not` matche tous les autres documents, comme chez ES
        parametres:
          supportes:
            - {nom: "must"}
            - {nom: "should"}
            - {nom: "filter"}
            - {nom: "must_not"}
            - {nom: "mustNot", note: "l'écriture camelCase **dépréciée**, qu'ES 8.15 sert encore — et la seule du DSL : `minimumShouldMatch`, `adjustPureNegative`, `maxExpansions`, `caseInsensitive`, `tieBreaker`, `scoreMode` sont tous refusés chez lui (mesuré, un par un). ferrite ne rend pas l'en-tête `Warning` de dépréciation qu'ES y ajoute"}
            - {nom: "boost"}
            - {nom: "minimum_should_match", note: "ses **quatre notations**, voir [la section dédiée](#minimum_should_match)"}
          refuses: ["_name", "adjust_pure_negative"]

      - id: dsl.nom_de_clause
        nom: "`_name` (nommer une clause), `matched_queries`, `include_named_queries_score`"
        etat: supporte
        poids: null
        detail: >-
          `_name` se pose **la ou `boost` se pose** — au niveau du champ pour
          les clauses qui en citent un (`{"term": {"k": {"value": …, "_name":
          …}}}`), au niveau du corps pour les autres (`bool`, `nested`,
          `dis_max`, `terms`…) : une valeur ecrite en raccourci ne peut donc pas
          etre nommee, et ES ne le permet pas non plus. Chaque clause nommee est
          **rejouee seule** contre chaque document rendu, comme le fait ES : un
          `should` place sous un `must_not` ne se nomme pas dans un document
          qui, lui, correspond. L'ordre de `matched_queries` n'est ni celui de
          la requete ni l'alphabetique — c'est l'ordre d'iteration d'une
          `HashMap` de Java, reproductible et reproduit (voir
          [`src/explain.rs`](../src/explain.rs)) ; deux noms qui tombent dans le
          **meme seau** sont la seule chose que ferrite ne classe pas comme ES.
          Un nom pose deux fois ne compte qu'une, le dernier gagnant, comme chez
          ES. `include_named_queries_score` (ES 8.13) rend le meme bloc en objet
          `{nom: score}`

      - id: dsl.non_supportees
        nom: >-
          `query_string`, `simple_query_string`, `intervals`, `terms_set`,
          `script`…
        etat: refuse
        motif: pas_encore
        poids: 6.1
        raison: >-
          `parsing_exception: unknown query [...]`, avec la liste des clauses
          connues — la plus regrettée est `query_string`, dont la syntaxe est un
          langage à part entière.
        conformance: {erreurs: ["unknown query \\["]}

  # ---------------------------------------------------------------------------
  - id: recherche_libre
    entete: ["Paramètre", "État", "Détail"]
    capacites:

      - id: libre.lenient
        nom: "`lenient`"
        etat: supporte
        poids: 0.6
        detail: >-
          un champ dont le **type ne sait pas lire la valeur** cherchée est
          écarté de la clause au lieu de faire échouer la recherche (`"alice"`
          sur un `long`, une date illisible, une phrase à préfixe sur un
          `keyword`). Accepté sur `multi_match` et `match` — et seulement là,
          comme chez ES (`match_phrase`, `term`, `range` le refusent des deux
          côtés)

      - id: libre.best_fields
        nom: "`type: best_fields` (défaut)"
        etat: supporte
        poids: 0.3
        detail: "le meilleur champ l'emporte (`dis_max`), `tie_breaker` optionnel"

      - id: libre.most_fields
        nom: "`type: most_fields`"
        etat: supporte
        poids: 0.0
        detail: >-
          les scores s'additionnent ; `tie_breaker` y est refusé (il n'y a pas de
          meilleur champ à départager)

      - id: libre.phrase
        nom: "`type: phrase`"
        etat: supporte
        poids: 0.3
        detail: >-
          `match_phrase` répété sur chaque champ, puis `dis_max` — exactement
          comme `best_fields` est `match` répété. `tie_breaker` s'applique

      - id: libre.phrase_prefix
        nom: "`type: phrase_prefix`"
        etat: supporte
        poids: 0.0
        detail: "idem, le dernier mot n'étant qu'un début de mot. `max_expansions` (défaut 50, comme ES)"

      - id: libre.cross_fields
        nom: "`type: cross_fields`, `bool_prefix`"
        etat: refuse
        motif: divergence_moteur
        poids: 0.1
        raison: >-
          le premier demande des statistiques de termes fusionnées entre champs,
          le second un scoring de suggestion : les approcher rendrait un autre
          classement que celui qu'un client attend.

      - id: libre.slop
        nom: "`slop`"
        etat: refuse
        motif: divergence_moteur
        poids: null
        raison: >-
          refusé quel que soit le type, pour la raison qui le fait refuser dans
          `match_phrase` (divergence n° 2).

      - id: libre.operator_phrase
        nom: "`operator` sous `phrase` / `phrase_prefix`"
        etat: partiel
        poids: null
        detail: "accepté et sans effet — c'est ce que fait ES (mesuré)"

  # ---------------------------------------------------------------------------
  - id: corps_search
    entete: ["", "État", "Détail"]
    capacites:

      - id: recherche.route
        nom: "`POST|GET /{index}/_search`, `POST|GET /_search`"
        etat: supporte
        poids: 33.9
        detail: >-
          `{index}` est une **expression** au sens d'ES (voir [Expressions
          d'index](#expressions-dindex-listes-motifs-alias)) ; sans index, la
          recherche porte sur tout, comme `_all`. Une recherche qui ne vise
          **aucun** index (cluster vide, motif sans correspondance) valide quand
          même son corps : requête, agrégations et tri sont lus contre un schéma
          vide avant qu'on conclue qu'il n'y a rien à chercher.
          `explain: true` (corps ou query string) ajoute `_explanation` à chaque
          hit, et — comme chez ES — `_shard` et `_node`, qu'il n'ajoute pas
          autrement
        conformance: {apis: [search]}

      - id: recherche.query
        nom: "`query`"
        etat: supporte
        poids: 25.3

      - id: recherche.from_size
        nom: "`from` / `size`"
        etat: supporte
        poids: 16.3
        detail: "corps ou query string. `from + size > 10000` ❌ (`max_result_window`)"

      - id: recherche.sort
        nom: "`sort`"
        etat: partiel
        poids: 3.2
        detail: >-
          multi-clés, `asc` / `desc`, sur `keyword` / numérique / `date` /
          `boolean`, plus `_score` et `_doc`. Le tableau `sort` est rendu dans
          chaque hit, et c'est là que se lisent les valeurs absentes : sur un
          entier, une date ou un `boolean` ES ne rend pas `null` mais une
          **vraie valeur** (`9223372036854775807` / `-9223372036854775808`,
          donc ex æquo avec un document qui la porte pour de bon), sur un
          flottant `"Infinity"` / `"-Infinity"` en **chaîne**, et seul un
          `keyword` rend `null`. En multi-index, un champ non mappé par un des
          index donne un échec **de ce shard** — sauf si `unmapped_type` fournit
          l'échappatoire. Deux index dont le tri ne tombe pas dans la même
          **famille** (`LONG` pour `byte`/`short`/`integer`/`long`/`date`/`boolean`,
          `FLOAT`, `DOUBLE`, `STRING`) ne se fusionnent pas : ES rend 400, et
          `float` et `double` n'y sont **pas** ensemble. Mesuré par
          [`sonde_tri.py`](../tests/compat/sonde_tri.py)
        parametres:
          supportes:
            - {nom: "missing", note: "`_last` (le défaut), `_first`, ou une valeur de substitution. Les deux mots-clés sont **sensibles à la casse** — `_FIRST` est une valeur, pas un mot-clé. La substitution est lue **au type du champ** : une chaîne suit `Long.parseLong` / `Double.parseDouble` (donc `\"+7\"` passe et `\"7.9\"` non), un nombre JSON se tronque (`7.9` vaut 7, `1e300` sature). Une **date** se substitue par un nombre de millisecondes et un `boolean` par `0` / `1` : `\"2020-03-01\"` et `true` y rendent 400, comme chez ES"}
            - {nom: "mode", note: "`min` / `max` / `sum` / `avg` / `median`, insensible à la casse. Le défaut n'est pas un mode mais une règle : le **minimum** en ordre croissant, le **maximum** en décroissant. `sum` sur des entiers **déborde en silence** comme un `long` de Java (`[1, i64::MAX]` se classe sur `i64::MIN`), `avg` arrondit par le `Math.round` de Java (donc vers le haut à la demie), et `median` moyenne les deux valeurs du milieu quand elles sont en nombre pair — la colonne étant triée à l'indexation des deux côtés"}
            - {nom: "unmapped_type", note: "le type sous lequel traiter un champ que **cet** index ne mappe pas, plutôt que de faire échouer son shard. Tous ses documents y sont « sans valeur ». Ignoré quand l'index mappe le champ, et refusé en le nommant sur un type que ferrite ne mappe pas (`ip`, `binary`, ...) ou qui n'est pas une feuille (`object`, `nested`)"}
          refuses:
            - {nom: "nested"}
            - {nom: "numeric_type"}
            - {nom: "format", note: "sur une clé de tri `date`"}
            - {nom: "ignore_unmapped", note: "il fait taire l'échec de shard d'un champ non mappé sous un `nested` ou un `_geo_distance` ; `unmapped_type` couvre le cas mappable, celui-ci ne se pose que sur les deux clés refusées ci-dessous"}
            - {texte: "le tri par script (`_script`, et son `type`)"}
            - {texte: "le tri géographique (`_geo_distance`, et avec lui `unit`, `distance_type`, `pin.location`)"}
            - {texte: "le tri sur un champ `text`", note: "y compris via `unmapped_type: text` — ES fait échouer le shard (« Fielddata is disabled »), ferrite aussi"}
            - {texte: "les trois paramètres ci-dessus à côté de `_score`", note: "ES les refuse aussi (`[_score] unknown field [mode]`) ; à côté de `_doc` il les **accepte et les ignore**, ferrite comme lui"}
            - {texte: "les trois paramètres ci-dessus en query string", note: "`?sort=` ne connaît que `champ:sens` chez ES comme ici"}
        conformance:
          erreurs:
            - "ne supporte pas \\[[a-z_]+\\] dans \\[sort\\]"
            - "ne supporte pas le type de champ \\[[a-z_]+\\] \\(\\[sort.unmapped_type\\]\\)"
            - "ne trie pas sur un champ \\[text\\]"

      - id: recherche.source
        nom: "`_source`"
        etat: supporte
        poids: 3.7
        detail: >-
          `true` / `false`, chaîne, liste, `{includes, excludes}`, motifs `*`.
          Aussi via `_source_includes` / `_source_excludes` en query string

      - id: recherche.fields
        nom: "`fields`"
        etat: partiel
        poids: 2.4
        detail: >-
          la façon que la 7.10+ met en avant — et celle qu'envoie Kibana — de
          demander autre chose que le `_source` complet. Les valeurs sont lues
          dans le **`_source`** puis typées selon le mapping : l'ordre du
          document et ses **doublons** sont donc conservés
          (`["zoulou","alpha","alpha"]` ressort tel quel), et `{"tag": 42}` sur
          un `keyword` ressort `["42"]`. **La forme est ce qui compte** :
          chaque valeur est un tableau, même pour un champ mono-valué, et un
          champ absent n'a **pas de clé** — ce n'est pas une valeur nulle. Un
          multi-field (`titre.keyword`) est adressable, un sous-champ de
          `nested` se rend **groupé par élément** sous sa racine
          (`{"lignes": [{"ref": ["X1"]}, {"q": [5]}]}`, un élément sans valeur
          demandée étant omis), et un motif `*` ne ramène **pas** les
          métadonnées. Mesuré champ par champ par
          [`sonde_fields.py`](../tests/compat/sonde_fields.py)
        parametres:
          supportes:
            - {nom: "field", note: "un nom, un motif `*`, un multi-field, un chemin pointé"}
            - {nom: "format", note: "sur un champ `date` ; il remplace celui du mapping"}
            - {nom: "include_unmapped", note: "lit dans `_source` les chemins qu'aucun champ ne mappe — ce que Kibana envoie sur chaque recherche"}
            - {texte: "`_id`, `_index` et `_version` nommés explicitement"}
          refuses:
            - {texte: "`_seq_no` et `_source` nommés dans `fields`", note: "ES rend un **500** dessus (« Cannot fetch values for internal field ») ; un 500 ne se reproduit pas, ferrite les refuse explicitement"}
            - {texte: "`?fields=` en query string", note: "ES ne le connaît pas non plus — il le refuse comme un paramètre inconnu"}
            - {texte: "un `format` qui n'est pas dans le vocabulaire de [`dateformat`](../src/dateformat.rs)", note: "ES accepte un motif inconnu et rend une chaîne absurde (`format: \"nawak\"` rend `\"0AM11AM24\"`) ; ferrite le refuse, comme partout ailleurs où il lit un `format`"}

      - id: recherche.docvalue_fields
        nom: "`docvalue_fields`"
        etat: partiel
        poids: 0.5
        detail: >-
          la valeur telle qu'elle est **stockée en colonne**, et ce n'est pas la
          même que celle du `_source` : les colonnes sont triées, donc un
          `keyword` en ressort trié **et dédoublonné** (`["alpha","zoulou"]`) là
          où `fields` garde `["zoulou","alpha","alpha"]`, un numérique trié
          **avec** ses doublons (`[1,1,3]`), et un `float` avec la précision de
          son stockage sur 32 bits — ES rend `0.10000000149011612` là où le
          `_source` porte `0.1`. Accepté aussi en query string
          (`?docvalue_fields=`)
        parametres:
          supportes:
            - {nom: "field", note: "un nom, un motif, un multi-field, un chemin pointé"}
            - {nom: "format", note: "sur un champ `date`"}
          refuses:
            - {texte: "un champ `text`", note: "il n'a pas de colonne ; ES fait échouer le shard (« Fielddata is disabled on [x] »), que le champ soit nommé ou attrapé par un motif — ferrite rend la même phrase"}
            - {texte: "un `format` sur un champ numérique", note: "ES l'interprète comme un `DecimalFormat` de Java (`format: \"yyyy\"` sur la valeur 1 rend `\"yyyy1\"`) ; ferrite ne l'imite pas"}
            - {texte: "une métadonnée (`_id`, ...)", note: "ES la refuse aussi (« Fielddata access on the _id field is disallowed »)"}
        conformance:
          erreurs:
            - "ne supporte pas \\[_[a-z_]+\\] dans \\[docvalue_fields\\]"

      - id: recherche.stored_fields
        nom: "`stored_fields`"
        etat: supporte
        poids: 6.6
        detail: >-
          rend les champs que le mapping déclare [`store: true`](#types-de-champ)
          — et **rien** pour les autres, comme un Elasticsearch dont le mapping
          ne le porte pas. Il ne reconstitue rien depuis `_source` : ce serait
          rendre des valeurs qu'ES ne rend pas. L'ordre est celui du document,
          doublons compris, là où `docvalue_fields` trie et dédoublonne. Il
          change aussi la réponse elle-même : il **retire `_source`** (sauf
          `_source` explicite), `_none_` retire **aussi `_id`**, et `_none_` avec
          `fields` est un 400. Accepté aussi en query string
        parametres:
          supportes:
            - {texte: "une liste de noms, un motif, `_none_`"}
            - {texte: "`?stored_fields=` en query string"}
            - {texte: "sur `GET /{index}/_doc/{id}` et `_mget` aussi", note: "en query string, et par descripteur dans le corps d'un `_mget` — celui du descripteur l'emporte sur celui de l'URL"}
          refuses:
            - {texte: "un champ stocké sous un `nested`", note: "ES ne le rend pas non plus : la valeur vit dans le document enfant"}

      - id: recherche.highlight
        nom: "`highlight`"
        etat: partiel
        poids: 1.9
        detail: >-
          les fragments surlignés d'une barre de recherche. Ce qui se reproduit
          ici n'est pas « marquer les termes » mais le **découpage** de Lucene,
          et aucune de ses règles n'était devinable : les phrases (au sens
          d'UAX#29) sont fusionnées vers l'avant tant que la longueur reste sous
          `fragment_size`, et une phrase qui déborde à elle seule est re-coupée
          **au mot** autour de la correspondance — donc `fragment_size: 19` rend
          une phrase là où `20` en rend deux, sur le même texte. Un point suivi
          d'une **minuscule** ne termine pas une phrase (règle SB8), un point
          entre deux capitales non plus. Le fragment se centre sur le **milieu**
          de la correspondance : sur un mot isolé ça ne se voit pas, sur un
          `match_phrase` de quatre mots le bord gauche se décale de plusieurs
          mots. Quand il y a plus de fragments que `number_of_fragments`, ce
          sont les mieux notés par le `PassageScorer` de Lucene qui restent,
          puis remis dans **l'ordre du document**. Une phrase rend **une seule**
          marque, du premier terme au dernier. Un champ multivalué est traité
          valeur par valeur — un fragment ne franchit jamais la frontière entre
          deux valeurs — mais les fragments de toutes les valeurs sont mis en
          concurrence ensemble. Un champ sans correspondance est **absent** de
          la réponse, pas une chaîne vide. Mesuré fragment par fragment par
          [`diff_highlight.py`](../tests/compat/diff_highlight.py)
        parametres:
          supportes:
            - {nom: "fields", note: "un nom, un motif `*`, la forme héritée en liste d'objets ; seuls les champs `text` et `keyword` répondent, comme chez ES"}
            - {nom: "pre_tags", note: "seule la première balise est employée, comme le surligneur par défaut d'ES"}
            - {nom: "post_tags"}
            - {nom: "tags_schema", note: "`default` et `styled` (`<em class=\"hlt1\">`)"}
            - {nom: "number_of_fragments", note: "`0` rend la valeur entière, valeur par valeur"}
            - {nom: "fragment_size", note: "`0` rend une phrase entière ; une valeur négative retombe sur le défaut, comme chez ES"}
            - {nom: "no_match_size", note: "le début de la **première** valeur, étendu à la frontière de mot qui suit"}
            - {nom: "require_field_match", note: "`true`, le défaut : le champ n'est surligné que par ce que la requête y pose"}
            - {texte: "la surcharge champ par champ de tous les réglages ci-dessus"}
            - {texte: "`order: none`", note: "le défaut : les fragments sortent dans l'ordre du document"}
          refuses:
            - {nom: "type", note: "`fvh`, `plain` et même `unified` écrit explicitement : ferrite n'a qu'un surligneur, et un `type` accepté en silence laisserait croire qu'un autre découpage a été appliqué"}
            - {nom: "order", note: "`score` trie les fragments par leur note ; ES y emploie un tri **instable** (`introSort`), donc deux fragments de même note ne sortent pas dans un ordre reproductible"}
            - {texte: "`require_field_match: false`", note: "ES y cherche les termes de **toutes** les clauses dans **tous** les champs, par une extraction qui n'est pas celle du mode normal — il en documente lui-même le résultat comme approximatif, et ferrite n'en reproduit pas tous les cas. Un refus se voit ; un fragment silencieusement différent, non"}
            - {nom: "highlight_query"}
            - {nom: "matched_fields"}
            - {nom: "boundary_scanner"}
            - {nom: "boundary_chars"}
            - {nom: "boundary_max_scan"}
            - {nom: "boundary_scanner_locale"}
            - {nom: "fragmenter"}
            - {nom: "encoder", note: "`html` échappe le texte du fragment"}
            - {nom: "force_source"}
            - {nom: "phrase_limit"}
            - {nom: "max_analyzed_offset"}
            - {texte: "un fragment d'un `nested` sous `inner_hits`", note: "`inner_hits` est hors périmètre ; un sous-champ de `nested` se surligne bien depuis la racine"}
        conformance:
          erreurs:
            - "ne supporte pas \\[(type|order|highlight_query|matched_fields|boundary_scanner|boundary_chars|boundary_max_scan|boundary_scanner_locale|fragmenter|encoder|force_source|phrase_limit|max_analyzed_offset|require_field_match: false)\\] dans \\[highlight"

      - id: recherche.script_fields
        nom: "`script_fields`, `runtime_mappings`"
        etat: refuse
        motif: hors_perimetre
        poids: 0.5
        raison: >-
          les deux définissent des champs **calculés par un script Painless**,
          que ferrite n'exécute pas. La mesure le confirme plutôt que la
          supposition : sur les 444 requêtes du corpus qui portent
          `runtime_mappings`, **425 l'envoient vide** (des gabarits de tracks
          Rally), et sur les 19 non vides **18 portent un script**. L'objet
          **vide** est donc accepté — il ne définit aucun champ, donc ne demande
          rien, et ES rend la même réponse avec ou sans (mesuré) ; un objet non
          vide est refusé explicitement.
        conformance:
          erreurs:
            - "ne supporte pas \\[(script_fields|runtime_mappings)\\] dans \\[_search\\]"

      - id: recherche.track_total_hits
        nom: "`track_total_hits`"
        etat: partiel
        poids: 0.4
        detail: "le total est **toujours exact** (`relation: \"eq\"`)"
        parametres:
          supportes:
            - {nom: "true"}
            - {texte: "une valeur numérique"}
          refuses:
            - {nom: "false", note: "il n'y a rien à économiser sur un total déjà exact"}
        conformance:
          # Sans ce motif, le refus est rattache a `recherche.route` — declaree
          # supportee — donc compte comme une **regression** alors qu'il est le
          # cout d'un parametre declare refuse juste au-dessus. Trouve par
          # `bench_echelle.py`, sur les deux operations de la track Rally
          # `geonames` qui posent `track_total_hits: false`.
          erreurs:
            - "ne supporte pas \\[track_total_hits: false\\]"

      - id: recherche.scoring
        nom: "Scoring"
        etat: partiel
        poids: null
        detail: >-
          BM25 (tantivy), `_score` et `max_score` renseignés ; `null` quand un
          tri est demandé, comme chez ES. Les **valeurs** ne sont pas comparées
          à celles d'ES (les constantes diffèrent) ; c'est l'**ordre** qui l'est,
          par [`diff_relevance.py`](../tests/compat/diff_relevance.py). Un `term`
          sur un champ numérique vaut `1.0` comme chez ES (requête de points), un
          `keyword` et un `boolean` sont indexés sans *fieldnorm* comme chez
          Lucene — donc deux documents qui portent la même valeur marquent pareil,
          quel que soit le nombre de valeurs du champ
        parametres:
          refuses:
            - texte: "l'`avgdl` de BM25 sur un champ `text` **facultatif**"
              note: >-
                Lucene calcule la longueur moyenne sur les documents **qui ont
                le champ**, tantivy sur **tous** les documents de l'index. Deux
                scores voisins peuvent alors s'inverser. Mesuré par
                [`fuzz_vs_es.py`](../tests/compat/fuzz_vs_es.py) ; l'ampleur est
                mesurée par `diff_relevance.py`. Et depuis `function_score`,
                cet écart de **valeur** peut devenir un écart d'**ensemble** :
                `min_score` est le seul endroit où le score cesse d'être un
                ordre pour devenir un seuil. Un `min_score` réglé sur les
                scores d'un vrai Elasticsearch ne coupe donc pas exactement au
                même endroit chez ferrite dès qu'un champ `text` est facultatif
                (mesuré : 0,998 chez ES contre 1,169 chez ferrite sur le même
                document, de part et d'autre d'un `min_score: 1`)
            - texte: "le score d'un `fuzzy`"
              note: >-
                tantivy le rend **constant** ; Lucene pondère chaque terme par sa
                distance d'édition. Les documents rendus sont les mêmes, leur
                ordre non

      - id: recherche.format_reponse
        nom: "Format de réponse"
        etat: supporte
        poids: null
        detail: >-
          `took`, `timed_out`, `_shards` (avec `failures[]` quand un index n'a pas
          su répondre), `hits.total.{value,relation}`, `hits.max_score`,
          `hits.hits[]` avec `_index` / `_id` / `_score` / `_source` / `sort`

      - id: recherche.preference
        nom: "`preference`"
        etat: partiel
        poids: null
        detail: "accepté, sans objet : il n'y a qu'un shard"

      - id: recherche.aggs
        nom: "`aggs` / `aggregations`"
        etat: partiel
        poids: 14.0
        detail: "voir la section dédiée"

      - id: recherche.scroll
        nom: "`scroll`"
        etat: supporte
        poids: null
        detail: "`?scroll=1m` ouvre un contexte figé et rend un `_scroll_id` — voir la section dédiée"

      - id: recherche.min_score
        nom: "`min_score`"
        etat: supporte
        poids: 0.0
        detail: >-
          le seuil de score sous lequel un document ne sort pas. Il ne se
          confond pas avec le `min_score` de `function_score`, qui vit **dans**
          la clause : celui-ci est posé sur la recherche entière, et sa place
          dans la chaîne est tout son intérêt. Mesuré contre ES 8.15 : il filtre
          **avant** `from` / `size`, donc il change `hits.total` (un filtrage
          fait côté client après coup ne donne ni le même compte ni la même
          pagination) ; les **agrégations ne voient pas** les documents qu'il
          écarte ; `max_score` est celui des documents retenus ; et il
          s'applique même sous un `sort` par champ, là où la réponse ne porte
          plus aucun score — c'est le piège déjà payé sur le `boost` d'une
          clause, tantivy laissant tomber le calcul du score quand personne ne
          le lit. Une requête purement filtrante note tout à `0.0` : un
          `min_score: 0.5` sur un `bool.filter` n'y rend donc aucun document.
          Voir [`src/seuil.rs`](../src/seuil.rs), mesuré par
          [`sonde_score.py`](../tests/compat/sonde_score.py)
        parametres:
          supportes:
            - {texte: "un nombre, ou la **chaîne** qui en porte un (`\"0.135\"` filtre comme `0.135`), comme chez ES"}
            - {texte: "un seuil négatif, qui ne filtre rien — ES le prend tel quel, il ne le refuse pas"}
          refuses:
            - {texte: "`null`", note: "`parsing_exception` / « Unknown key for a VALUE_NULL in [min_score]. », la phrase d'ES"}
            - {texte: "une chaîne illisible", note: "`number_format_exception` / « For input string: \"abc\" », la phrase d'ES"}
            - {texte: "reproduire les agrégations qu'**ES** calcule sans tenir compte de son propre seuil", note: "divergence assumée, et c'est ES qui se contredit : avec `{\"query\": {\"match_all\": {}}, \"min_score\": 2}` sur cinq documents, il rend `hits.total: 0` et, **dans la même réponse**, un `value_count` à 0 mais un `terms` avec ses deux seaux pleins. Les deux agrégateurs ne prennent pas le même chemin ; le même seuil sur un `term` ou un `match` est honoré par les deux. ferrite applique le seuil **uniformément** — ses agrégations voient exactement les documents que `hits.total` compte. Reproduire l'écart demanderait une table « quel agrégateur fuit, sous quelle forme de requête » dont la règle n'est écrite nulle part, et qu'ES ne tient pas dans une seule réponse"}

      - id: recherche.non_supportes
        nom: >-
          `search_after`, `pit`, `collapse`, `knn`,
          `seq_no_primary_term`, `post_filter`, `suggest`,
          `rescore`, `track_scores`, `q`, `terminate_after`,
          `version`, `indices_boost`, `profile`, `slice`, `stats`, `ext`,
          `retriever`
        etat: refuse
        motif: pas_encore
        poids: 3.0
        raison: >-
          aucun n'est un obstacle de moteur ; `search_after` est celui qui
          manque le plus, pour paginer au-delà de 10 000.
        conformance:
          erreurs:
            # Le meme refus arrive par deux chemins : dans le corps (« ferrite
            # ne supporte pas [search_after] dans [_search] ») et en query
            # string (« unrecognized parameter: [docvalue_fields] »).
            - "ferrite ne supporte pas \\[(search_after|collapse|knn|post_filter|suggest|rescore|track_scores|q|pit|profile|terminate_after|version|indices_boost|slice|stats|ext|retriever)\\] dans \\[_search\\]"
            - "unrecognized parameter: \\[(search_after|collapse|knn|fields|seq_no_primary_term|post_filter|suggest|rescore|track_scores|q)\\]"

      - id: recherche.timeout
        nom: "`timeout` (paramètre et corps)"
        etat: partiel
        poids: 1.8
        detail: >-
          accepté et **vérifié**, sans objet : chez ES c'est une borne par shard
          au-delà de laquelle la collecte s'arrête et la réponse sort
          **partielle** avec `timed_out: true` ; ferrite cherche en un seul
          morceau, dans le processus, et rend toujours un résultat complet et
          `timed_out: false` — le sens sûr, puisqu'un `timeout` honoré rendrait
          *moins* de documents. Ce qui reste juste, c'est la forme : `1` (unité
          manquante), `1M`, `-2s`, `1.5s` sont refusés avec les phrases d'ES,
          `0`, `-1`, `1D` et `1MS` acceptés — tous mesurés. C'est le seul des
          quatre manques de cette famille qui n'a pas été trouvé par une suite
          de conformance mais par la **suite de tests du client go**

      - id: recherche.expressions_index
        nom: "`ignore_unavailable`, `allow_no_indices`, `expand_wildcards`"
        etat: supporte
        poids: null
        detail: >-
          voir [Expressions d'index](#expressions-dindex-listes-motifs-alias) —
          `expand_wildcards=none` reste ❌

      - id: recherche.routing_filter_path
        nom: "`routing`, `filter_path`, `typed_keys`"
        etat: refuse
        motif: hors_perimetre
        poids: null
        raison: >-
          ferrite est mono-shard, `routing` n'a rien à choisir ; les deux autres
          changent la forme de la réponse, et une forme qui dépend d'un paramètre
          est une seconde API à mesurer.
        conformance: {erreurs: ["unrecognized parameter: \\[(routing|filter_path|typed_keys)\\]"]}

      - id: recherche.reglages_de_shards
        nom: >-
          `search_type`, `max_concurrent_shard_requests`, `pre_filter_shard_size`,
          `batched_reduce_size`
        etat: refuse
        motif: hors_perimetre
        poids: null
        raison: >-
          ils reglent la façon dont une recherche se distribue entre shards ; il
          n'y en a qu'un, donc rien à distribuer et rien à régler.
        conformance:
          erreurs: ["unrecognized parameter: \\[(search_type|max_concurrent_shard_requests|pre_filter_shard_size|batched_reduce_size)\\]"]

      - id: recherche.rest_total_hits_as_int
        nom: "`rest_total_hits_as_int`"
        etat: refuse
        motif: pas_encore
        poids: null
        raison: >-
          il change la forme de `hits.total` (nombre au lieu d'objet) ; ES 8
          l'accepte encore et du code venu de la 6.x/7.x s'en sert, voir
          [`compat-es7.md`](compat-es7.md).

      - id: recherche.msearch
        nom: "`_msearch`, `_search/template`"
        etat: refuse
        motif: pas_encore
        poids: 0.0
        raison: >-
          `_msearch` est le plus regretté : un tableau de bord qui pose six
          facettes fait six appels au lieu d'un.
        conformance: {apis: [msearch]}

      - id: recherche.explain
        nom: "`GET|POST /{index}/_explain/{id}`, `explain: true`"
        etat: partiel
        poids: 0.1
        detail: >-
          « pourquoi **ce** document, avec ce score ». `matched` est exact des
          deux côtés, et l'arbre `{value, description, details}` reproduit la
          **forme** et les **valeurs** de celui d'ES — pas ses phrases, qui sont
          du texte de Lucene. Là où la phrase diffère, c'est que la quantité
          diffère, et c'est écrit : `N, total number of documents` ici contre
          `N, total number of documents **with field**` chez ES. Cet arbre est
          l'instrument qui chiffre la [divergence de
          scoring](#scoring--ce-que-le-bm25-de-tantivy-ne-calcule-pas-comme-celui-de-lucene) :
          `tests/compat/sonde_explain.py --ecart` pose les cinq statistiques du
          BM25 côte à côte et recalcule les deux scores à partir des deux séries
        parametres:
          supportes:
            - {nom: "query", note: "obligatoire, comme chez ES (`query is missing`)"}
            - {nom: "_name", note: "lu ici aussi, mais `matched_queries` n'est pas dans la réponse d'`_explain` — ES non plus"}
            - {texte: "`preference`, `routing`, `realtime`", note: "acceptés, sans objet : un seul shard"}
          refuses:
            - {texte: "la **raison** d'une non-correspondance", note: "ES reconstruit l'explication Lucene (`Failure to meet condition(s) of required/prohibited clause(s)`) ; ferrite rend `matched: false` et le dit, plutôt que d'inventer une raison plausible"}
            - {texte: "`q`, `df`, `default_operator`, `analyzer`, `analyze_wildcard`, `lenient`", note: "la recherche par chaîne n'est pas implémentée"}
            - {texte: "`_source`, `stored_fields`", note: "la route rend l'arbre du score, pas le document"}
        conformance: {apis: [explain]}

      - id: recherche.field_caps
        nom: "`GET|POST /{index}/_field_caps`"
        etat: partiel
        poids: 0.2
        detail: >-
          par champ, son type, `searchable` et `aggregatable`, et l'agrégation
          **par index** quand plusieurs sont visés — c'est la question que pose
          un outil de découverte avant de proposer un filtre qui échouerait sur
          la moitié des index. Toute l'information est déjà dans le mapping —
          mais elle ne se déduit pas du seul **type** : un champ `index: false`
          reste `searchable` tant qu'il a une colonne, et ne l'est plus quand il
          n'en a pas (un `text`). C'est ce que rend ES, mesuré, et c'est ce que
          ferrite rend
        parametres:
          supportes:
            - {nom: "fields", note: "dans l'URL ou dans le corps, jokers compris"}
            - {nom: "include_unmapped"}
            - {nom: "index_filter", note: "n'décrire que les index qui ont au moins un document correspondant"}
          refuses:
            - {texte: "les champs de métadonnées (`_id`, `_index`, `_seq_no`…)", note: "ES les rend sur `fields=*` ; ferrite ne sait pas les interroger, et les annoncer `searchable` serait un résultat faux"}
            - {nom: "runtime_mappings"}
        conformance: {apis: [field_caps]}

      - id: recherche.validate_query
        nom: "`GET|POST /{index}/_validate/query`"
        etat: partiel
        poids: 0.1
        detail: >-
          le traducteur du Query DSL rendu observable, sans exécuter. Les deux
          formes de réponse d'ES sont reproduites, et la distinction compte :
          une requête mal formée (clause inconnue) rend `valid: false` **sans**
          `_shards`, une requête que ce mapping-là ne sait pas construire rend
          `_shards` et une explication par index
        parametres:
          supportes:
            - {nom: "explain"}
            - {nom: "all_shards", note: "un shard par index : sans objet ici"}
            - {texte: "`ignore_unavailable`, `allow_no_indices`, `expand_wildcards`"}
          refuses:
            - {nom: "rewrite", note: "il demande la forme **réécrite** de la requête Lucene, que ferrite n'a pas"}
            - {nom: "q", note: "la recherche par chaîne (`query_string`) n'est pas implémentée ; `df`, `default_operator`, `analyzer`, `analyze_wildcard` et `lenient` la suivent"}
        conformance:
          apis: [indices.validate_query]
          erreurs:
            - "ne supporte pas \\[(rewrite|q|df|default_operator|analyzer|analyze_wildcard|lenient)\\] sur \\[_validate/query\\]"

  # ---------------------------------------------------------------------------
  - id: datemath
    entete: ["Forme", "État", "Détail"]
    capacites:

      - id: datemath.now
        nom: "`now`"
        etat: supporte
        poids: 0.1
        detail: >-
          résolu **une fois par recherche**, comme ES sur son nœud coordinateur :
          deux bornes de la même requête parlent du même instant

      - id: datemath.decalage
        nom: "`now±<n><unité>`"
        etat: supporte
        poids: 0.1
        detail: >-
          unités `y`, `M`, `w`, `d`, `h` et `H`, `m`, `s`. `+1M` sur le 31 janvier
          donne le 28 février (le jour est ramené au dernier du mois), comme Java

      - id: datemath.arrondi
        nom: "`now/<unité>`"
        etat: supporte
        poids: 0.1
        detail: >-
          arrondi ; `/w` arrondit au **lundi**. Sous une borne haute (`gt`,
          `lte`), chaque `/` rend le **dernier instant** de la période
          (`2026-03-15||/M` sous `lte` = 31 mars 23:59:59.999)

      - id: datemath.ancre
        nom: "`<ancre>||<opérations>`"
        etat: supporte
        poids: 0.0
        detail: >-
          l'ancre est lue avec le `format` du champ (ou celui de la requête), et
          toujours **arrondie vers le bas**, même sous un `lte`

      - id: datemath.date_partielle
        nom: "date partielle (`2026-03-15`, `2026-03`, `2026-03-15T12`)"
        etat: supporte
        poids: null
        detail: >-
          les champs d'heure absents sont remplis au maximum sous une borne haute
          (`lte: "2026-03-15"` couvre la journée), les champs de **date** absents
          restent au minimum (`2026-03` → le 1er, pas le 31)

      - id: datemath.format
        nom: "`format` sur `range`"
        etat: supporte
        poids: null
        detail: >-
          remplace le format du champ pour **lire les bornes** ; il ne s'applique
          pas à `now`

      - id: datemath.autres_clauses
        nom: "dans `term`, `terms`, `match`, et sous un `nested`"
        etat: supporte
        poids: null
        detail: >-
          une date y désigne la période qu'elle couvre : `{"term": {"d": "2026-03-15"}}`
          rend toute la journée, comme chez ES

      - id: datemath.indexation
        nom: "à l'indexation"
        etat: refuse
        motif: comme_es
        poids: null
        raison: >-
          `{"d": "now"}` est refusé, comme chez ES : le document porterait une
          date qui dépend de l'instant où il a été écrit.

      - id: datemath.time_zone
        nom: "`time_zone`"
        etat: supporte
        poids: null
        detail: >-
          la borne est **résolue dans le fuseau**, arrondi compris : une date
          écrite sans décalage (`2026-03-29`) est minuit **local**, `now/d`
          arrondit au jour local, et `lte: "2026-03-29"` couvre la journée
          locale — qui ce jour-là, à Paris, dure 23 heures. Une date qui porte
          déjà son décalage (`…Z`, `+02:00`) ou un nombre d'époque désigne un
          instant : le fuseau ne la déplace pas (mesuré). Les règles de
          changement d'heure viennent du tzdb du **JDK d'Elasticsearch**
          ([`fuseau.rs`](../src/fuseau.rs)), et une heure locale qui n'a jamais
          existé est décalée de la durée du trou, comme le fait Java

  # ---------------------------------------------------------------------------
  - id: aggs
    entete: ["Agrégation", "État", "Détail"]
    capacites:

      - id: agg.metriques
        nom: "`min`, `max`, `sum`, `avg`, `value_count`, `stats`"
        etat: supporte
        poids: 3.6
        detail: >-
          `field`, `missing`. Sur un champ `date`, la valeur est en millisecondes
          et le `*_as_string` est rendu comme chez ES. Les trois qui accumulent
          (`sum`, `avg`, `stats`) le font en `double` avec la compensation de
          Kahan, **comme ES**, et lisent les valeurs d'un document multivalué
          dans le même ordre que lui (croissant) — sans quoi le résultat diffère
          au-delà de 2^53 : voir la divergence n° 22 pour le seul cas qui reste
        parametres:
          refuses:
            - texte: "une somme qui n'est pas **finie**"
              note: >-
                au-delà de 1,8 × 10³⁰⁸ une somme de `double` déborde ; ES rend
                alors la chaîne JSON `\"Infinity\"`, ferrite rend `null` — voir
                la divergence assumée n° 22

      - id: agg.terms
        nom: "`terms`"
        etat: partiel
        poids: 7.5
        detail: >-
          `sum_other_doc_count` est renseigné — **après** filtrage, comme chez
          ES : les documents des termes qu'un `include` / `exclude` écarte n'y
          sont pas du tout. `doc_count_error_upper_bound` suit la règle d'ES :
          `-1` quand l'ordre ne classe pas par compte décroissant (`_count`
          **croissant**, ou une sous-agrégation) **et** que le nombre de termes
          distincts atteint `shard_size` (`size × 1,5 + 10` par défaut), `0`
          partout ailleurs — `_key` compris, dans les deux sens. Sur un champ
          `date`, la clé du bucket est rendue en millisecondes avec son
          `key_as_string`, comme chez ES
        parametres:
          supportes:
            - {nom: "field"}
            - {nom: "size"}
            - {nom: "shard_size"}
            - {nom: "min_doc_count", note: "sa valeur par défaut (`1`) seulement — voir ci-dessous"}
            - nom: "order"
              note: >-
                `_count`, `_key`, et le chemin d'une **sous-agrégation
                métrique** — `{"prix_moyen": "desc"}` sur un `avg`,
                `{"stats_prix.avg": "desc"}` sur un `stats` (les cinq
                valeurs `count` / `min` / `max` / `avg` / `sum`). Une métrique
                à valeur unique s'écrit aussi bien `pm` que `pm.value`. Le sens
                se lit sans égard à la casse, comme chez ES. Les ex æquo sont
                départagés par **clé croissante dans les deux sens**, et un
                seau dont la métrique n'a aucune valeur se classe là où ES le
                met : comme `NaN` sous un `avg` (donc en tête d'un `desc`),
                comme `+∞` sous un `min`, comme `-∞` sous un `max`
            - nom: "include"
              note: >-
                sur un champ `keyword`, dans les deux formes d'ES : une
                **expression régulière** dans la syntaxe de Lucene, ancrée sur
                le terme entier (`^` et `$` y sont des littéraux) et traduite
                par le même code que celle d'une requête `regexp` — donc avec
                les mêmes quatre opérateurs refusés ; ou une **liste exacte de
                valeurs**, dont chaque élément est lu comme du texte
                (`include: [1]` cherche le terme `"1"`, comme chez ES)
            - {nom: "exclude", note: "les deux mêmes formes, et les deux peuvent être posées ensemble"}
            - {nom: "missing", note: "sur un `keyword` ou un numérique. La valeur est posée **au type du champ**, comme chez ES : `missing: 0` sur un `keyword` y devient la clé `\"0\"`, et un `\"3\"` sur un `long` la clé `3`"}
          refuses:
            - texte: "une valeur de remplissage sur un champ `date` ou `boolean`"
              note: >-
                tantivy ne lit pas la date et rangerait ces documents sous
                `1970-01-01`, en 200 et sans un mot ; sur un booléen il n'arrive
                pas à poser la valeur du tout. Une valeur de remplissage placée
                au mauvais endroit se lit comme une donnée
            - texte: "une valeur de remplissage d'un type que le champ ne sait pas lire"
              note: "un `1.5` sur un `long` promeut chez ES **toutes** les clés du bucket en flottant ; ES refuse les autres cas, ferrite aussi"
            - texte: "`min_doc_count` autre que sa valeur par défaut (`1`)"
              note: >-
                à `0`, il demande un bucket pour les valeurs que la recherche n'a
                **pas** trouvées, et l'agrégation de tantivy ne le rend pas de
                façon fiable : zéro bucket sur une colonne numérique, zéro
                bucket quand la requête ne ramène rien, et des buckets vides
                privés de leurs sous-agrégations. Au-delà de `1`, c'est
                `sum_other_doc_count` qui ne suit plus : la règle d'ES a été
                cherchée pour de bon, une formule ajustée sur quinze formes d'un
                corpus les collait toutes puis s'est effondrée sur d'autres
                (27 écarts sur 1 450 cas tirés au sort). Elle dépend de l'ordre
                demandé, de la troncature et de l'ordre de parcours du
                dictionnaire de termes — c'est le collecteur d'ES qu'il faudrait
                réécrire, et annoncer un compte faux serait pire. Mesuré par
                [`fuzz_vs_es.py`](../tests/compat/fuzz_vs_es.py)
            - texte: "un filtre de termes — inclusion ou exclusion — sur un champ qui n'est **pas** textuel"
              note: >-
                ES sert la liste exacte sur un numérique, une date et un
                booléen (`include: [1, 3]` sur un `long` rend deux seaux) ;
                l'agrégation de tantivy, elle, ne filtre les termes que sur une
                colonne de chaînes et **écarte la colonne entière** dès qu'elle
                ne l'est pas — elle rendrait zéro seau, en 200 et sans un mot.
                L'expression régulière, elle, est refusée **des deux côtés** :
                le message d'ES est repris mot pour mot
            - texte: "un filtre de termes posé en même temps qu'une valeur de remplissage"
              note: >-
                le seau de remplissage de `missing` n'a pas d'identifiant dans
                le dictionnaire de termes : le filtre de tantivy l'écarte
                toujours, alors qu'ES le traite comme un terme ordinaire — il
                reste sous un `exclude` qui ne le vise pas, et il sort sous un
                `include` qui le nomme. Perdre en silence les documents sans
                valeur est exactement ce qu'une facette ne doit pas faire
            - texte: "la forme partitionnée (`{\"partition\": n, \"num_partitions\": m}`)"
              note: >-
                elle retient un terme selon un **hachage** de sa valeur —
                `Math.floorMod(murmurhash3_x86_32(terme, 31), num_partitions)`,
                mesuré contre ES 8.15 et stable à son redémarrage. La règle est
                donc connue ; ce qui manque est un moyen de l'exprimer à
                tantivy, dont le filtre ne connaît qu'une expression régulière
                ou une liste exacte. Il faudrait énumérer tout le dictionnaire
                de termes pour en dresser la liste, ce qui défait la raison
                d'être du paramètre — parcourir un champ à très forte
                cardinalité sans tout charger
            - texte: "un chemin d'ordre à plusieurs niveaux (`filtre>prix`)"
              note: >-
                ES descend à travers une agrégation mono-seau ; la seule
                qu'implémente ferrite (`filter`) est déjà refusée sous une
                agrégation de seaux
            - texte: "l'ordre par une agrégation mono-seau"
              note: >-
                ES classe alors les seaux sur son `doc_count`, que le chemin le
                nomme ou non ; la seule agrégation mono-seau que ferrite serve
                est déjà refusée sous une agrégation de seaux, donc le chemin ne
                mène nulle part
            - texte: "l'ordre par une agrégation de **seaux**, ou par une clé que la métrique ne rend pas"
              note: >-
                ES refuse aussi, avec le même statut — mais seulement quand il a
                **deux seaux à comparer** : le chemin n'est résolu qu'au moment
                de trier, donc à zéro ou un seau il rend 200 sur la même demande
                fautive. ferrite valide avant d'exécuter : voir la divergence
                assumée n° 23
            - {nom: "collect_mode"}
            - {nom: "execution_hint"}
            - {nom: "script"}
            - {nom: "shard_min_doc_count"}
            - {nom: "show_term_doc_count_error"}

      - id: agg.range
        nom: "`range`"
        etat: partiel
        poids: 0.2
        detail: >-
          `ranges` avec `from` / `to` / `key`, `keyed`. Sur un champ `date`, les
          bornes s'écrivent **en dates** (au `format` du champ) et les buckets
          rendent `from_as_string` / `to_as_string`. Les intervalles que le
          client n'a pas demandés sont écartés : tantivy comble les trous entre
          deux bornes, Elasticsearch non
        parametres:
          refuses:
            - texte: "un **trou** entre deux intervalles, sur un champ `date`"
              note: >-
                tantivy comble les trous et ferrite écarte ensuite le bucket de
                remplissage ; sur une date, où les bornes passent en
                nanosecondes, ce remplissage avale l'intervalle demandé. Sur un
                champ numérique, les deux buckets sortent et le filtrage suffit
            - texte: "des intervalles qui se **chevauchent**"
              note: >-
                ES compte alors un document dans chaque bucket qui le contient ;
                l'agrégation de tantivy partitionne les valeurs et ne sait pas
                le faire
            - {texte: "un champ **multivalué**", note: "voir la ligne suivante"}

      - id: agg.histogram
        nom: "`histogram`"
        etat: partiel
        poids: 0.2
        detail: "`interval`, `offset`, `min_doc_count`, `hard_bounds`, `extended_bounds`, `keyed`"
        parametres:
          refuses:
            - {texte: "un champ **multivalué**", note: "voir la ligne suivante"}

      - id: agg.date_histogram
        nom: "`date_histogram`"
        etat: partiel
        poids: 5.3
        detail: >-
          les seaux sont **calculés par ferrite** ([`histodate.rs`](../src/histodate.rs)) :
          une pré-passe mesure le premier et le dernier instant, les bornes sont
          déroulées par l'arrondi d'Elasticsearch reproduit
          ([`calendrier.rs`](../src/calendrier.rs)), et tantivy exécute le
          `range` contigu qui en résulte — donc avec ses sous-agrégations et sa
          fusion multi-index. C'est ce qui rend `calendar_interval` et
          `time_zone` possibles : un mois civil n'a pas de durée constante, et
          un jour à Paris en a deux (23 h et 25 h)
        parametres:
          supportes:
            - {nom: "field"}
            - {nom: "fixed_interval"}
            - {nom: "calendar_interval", note: "`second`/`1s`, `minute`/`1m`, `hour`/`1h`, `day`/`1d`, `week`/`1w`, `month`/`1M`, `quarter`/`1q`, `year`/`1y` — **une** unité, jamais un multiple, comme chez ES"}
            - {nom: "time_zone", note: "identifiant IANA (`Europe/Paris`) ou décalage (`+05:30`). Les seaux suivent l'heure locale : un jour de changement d'heure dure 23 ou 25 heures, un `fixed_interval: 3h` posé sur la nuit d'octobre dure quatre heures réelles, et `key_as_string` porte le décalage local (`2026-03-01T00:00:00.000+01:00`)"}
            - {nom: "format", note: "rend `key_as_string` à ce format, dans le fuseau"}
            - {texte: "`offset`, `min_doc_count`, `hard_bounds`, `extended_bounds`, `keyed`", note: "`extended_bounds` et `hard_bounds` sont lues **dans le fuseau** puis arrondies ; la borne haute de `hard_bounds` est exclue, celle d'`extended_bounds` incluse (mesuré)"}
          refuses:
            - {nom: "order"}

      - id: agg.sous_agregations
        nom: "Sous-agrégations"
        etat: supporte
        poids: 8.8
        detail: >-
          sur tous les types de buckets, vérifiées jusqu'à trois niveaux. Un
          bucket **vide** porte les siennes, comme chez ES : tantivy comble les
          trous d'un `histogram` sans exécuter ce qu'il y a dessous, et ferrite
          y remet la forme « zéro document » — mesurée sur une recherche qui ne
          ramène rien, pas écrite à la main. Un bucket **rare** porte les
          siennes aussi, ce qui n'a pas toujours été vrai : tantivy 0.26.1
          perdait ses documents au-delà de 2 048 par segment, en 200 et avec le
          bon `doc_count` à côté. Le correctif d'amont est épinglé (voir
          [`tantivy-patch.md`](tantivy-patch.md)), et 46 combinaisons parent ×
          sous-agrégation le tiennent contre un vrai ES
          ([`sonde_sous_aggs.py`](../tests/compat/sonde_sous_aggs.py))

      - id: agg.multivalue
        nom: "`histogram`, `date_histogram`, `range` sur un champ **multivalué**"
        etat: refuse
        motif: divergence_moteur
        poids: null
        raison: >-
          l'agrégation de tantivy compte les **valeurs**, Elasticsearch compte
          les **documents** : un document dont le champ vaut `[1, 2, 3]` tombe
          trois fois dans le bucket qui les contient (mesuré : `doc_count` de 4
          là où ES en compte 2). Le refus n'est prononcé que si la colonne est
          réellement multivaluée — un champ à une valeur par document, le cas
          courant, reste servi et exact. `terms`, `value_count` et `stats` ne
          sont pas concernés : leurs comptes coïncident avec ceux d'ES.
        conformance: {erreurs: ["sur le champ multivalue"]}

      - id: agg.cardinality
        nom: "`cardinality`"
        etat: refuse
        motif: divergence_moteur
        poids: 1.5
        raison: >-
          l'estimation de tantivy diffère de celle d'ES (mesuré : 582 valeurs
          distinctes annoncées là où ES en compte 598), y compris sous le seuil
          où ES est exact — un compte approché sous le nom d'ES serait faux sans
          le dire.

      - id: agg.filter
        nom: "`filter`"
        etat: partiel
        poids: 1.1
        detail: >-
          n'importe quelle requête du Query DSL, avec ses sous-agrégations.
          **Exécutée par ferrite**, pas par tantivy : compter les documents qui
          correspondent à la recherche *et* au filtre, c'est exécuter
          l'intersection des deux requêtes (voir les divergences)
        parametres:
          refuses:
            - {texte: "sous une agrégation de buckets", note: "il faudrait rejouer sa requête bucket par bucket"}

      - id: agg.non_supportees
        nom: >-
          `percentiles`, `extended_stats`, `top_hits`, `composite`, `filters`,
          `nested`, `significant_terms`, `date_range`, `ip_range`…
        etat: refuse
        motif: pas_encore
        poids: 6.1
        raison: >-
          `filters` (la sœur plurielle de `filter`) et `top_hits` sont les deux
          qui manquent le plus ; aucune n'est un obstacle de moteur.
        conformance:
          erreurs: ["ferrite ne supporte pas l'agregation", "agregation \\[[a-z_]+\\] inconnue"]

  # ---------------------------------------------------------------------------
  - id: nested
    entete: ["", "État", "Détail"]
    capacites:

      - id: nested.clause
        nom: "`{\"nested\": {\"path\", \"query\"}}`"
        etat: supporte
        poids: 0.2
        detail: "`path` doit être un champ déclaré `nested`"

      - id: nested.clauses_internes
        nom: "Clauses internes"
        etat: partiel
        poids: null
        detail: >-
          le minimum s'y compte **par élément**, comme ES le compte par document
          caché
        parametres:
          supportes:
            - {texte: "`term`, `terms`, `range`, `exists`, `prefix`, `match_all`, `match_none`"}
            - {nom: "match", note: "sur un champ non analysé"}
            - {nom: "bool", note: "`must` / `filter` / `should` + [`minimum_should_match`](#minimum_should_match) dans ses quatre notations / `must_not`"}

      - id: nested.champ_text
        nom: "Champ `text` dans une clause interne"
        etat: refuse
        motif: divergence_moteur
        poids: null
        raison: >-
          les colonnes portent la valeur, pas les termes analysés : interroger
          son multi-field `.keyword`, ou sortir la clause du `nested`.

      - id: nested.imbrique
        nom: "`nested` dans un `nested`"
        etat: refuse
        motif: pas_encore
        poids: null
        raison: "il faudrait un indice d'élément par niveau."

      - id: nested.score_mode
        nom: "`score_mode`"
        etat: partiel
        poids: null
        detail: >-
          le score est celui de la requête interne évaluée à plat, il n'y a pas
          de score par élément — sauf `none`, qui **est** un score et vaut
          **zéro** : ES y construit un filtre, pas une jointure notée. ferrite
          rendait le score du pré-filtre (1.0 sur un `exists`), et ça ne se
          voyait nulle part, puisqu'un facteur constant ne change pas un
          ensemble de documents. Sauf sous un `min_score`, qui en fait un
          seuil : `min_score: 1` y gardait 15 documents là où ES n'en rend
          aucun, en 200. Trouvé par le fuzzer le jour où `min_score` lui a donné
          de quoi le voir
        parametres:
          supportes: ["none", "avg"]
          refuses: ["max", "min", "sum"]

      - id: nested.inner_hits
        nom: "`inner_hits`, `ignore_unmapped`"
        etat: refuse
        motif: pas_encore
        poids: null
        raison: >-
          `inner_hits` demande de rendre l'élément qui a correspondu : ferrite
          le sait (c'est la colonne jumelle), il ne l'expose simplement pas.

      - id: nested.champs_devines
        nom: "Champs devinés sous un `nested`"
        etat: supporte
        poids: null
        detail: "le mapping dynamique fonctionne, et la corrélation avec"

      - id: nested.tri_et_aggs
        nom: "Tri et agrégations sur un sous-champ de `nested`, depuis la racine"
        etat: refuse
        motif: divergence_moteur
        poids: null
        raison: >-
          ils porteraient sur les valeurs à plat, donc sur autre chose que ce que
          la requête a filtré. Chez Elasticsearch ces valeurs vivent dans des
          documents cachés : une **agrégation** n'en voit aucune et rend son
          résultat vide (`null`, `0.0`, `buckets: []`), un **tri** est refusé
          (`it is mandatory to set the [nested] context on the nested sort
          field`). ferrite les porte sur le document parent : il rendait donc
          une moyenne de `7.0` là où ES rend `null`, et un ordre en 200 là où ES
          rend 400. Un chiffre plausible et faux est le pire des résultats — le
          refus est explicite, et c'est le même que pour la requête équivalente
          (divergence n° 10).
        conformance:
          erreurs: ["est sous le champ .nested.", "on the nested sort field"]

  # ---------------------------------------------------------------------------
  - id: join
    entete: ["", "État", "Détail"]
    capacites:

      - id: join.type
        nom: "`{\"type\": \"join\", \"relations\": {...}}`"
        etat: supporte
        poids: 0.2
        detail: "un seul champ `join` par index, plusieurs relations et plusieurs enfants par parent"

      - id: join.indexation
        nom: "Indexation"
        etat: supporte
        poids: null
        detail: >-
          `"lien": "article"` ou `{"name": "commentaire", "parent": "a1"}`. Un
          enfant sans `parent`, un parent avec, ou une relation non déclarée :
          refus explicite

      - id: join.has_child
        nom: "`has_child`, `has_parent`"
        etat: partiel
        poids: 0.1
        detail: "avec n'importe quelle requête interne"
        parametres:
          supportes:
            - {nom: "type", note: "`parent_type` pour `has_parent`"}
            - {nom: "parent_type"}
            - {nom: "query"}
            - {nom: "score_mode", note: "`none` seulement — la jointure rend un score constant"}
          refuses: ["min_children", "max_children", "inner_hits", "ignore_unmapped", "score"]

      - id: join.parent_id
        nom: "`parent_id`"
        etat: supporte
        poids: 0.0

      - id: join.term
        nom: "`{\"term\": {\"lien\": \"article\"}}`"
        etat: supporte
        poids: null
        detail: "le champ `join` se filtre comme un `keyword`, sous son propre nom, comme chez ES"

      - id: join.routing
        nom: "`routing`"
        etat: partiel
        poids: null
        detail: >-
          accepté et sans objet : il n'y a qu'un shard, donc rien à co-localiser.
          C'est **une contrainte d'ES en moins**
